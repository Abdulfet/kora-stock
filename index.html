<!DOCTYPE html>
<html lang="am" id="docRoot">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ኮራ ስቶክ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <meta name="theme-color" content="#060a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    :root {
      --bg: #060a12;
      --surface: #0f172a;
      --surface-deep: #090f1d;
      --card: rgba(15, 23, 42, 0.92);
      --border: #1e293b;
      --border-strong: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #0ea5e9;
      --teal: #14b8a6;
      --teal-dark: #042f2e;
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #ef4444;
      --violet: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
    input, select, textarea { user-select: auto; }
    html, body { height: 100%; width: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
    button { transition: transform 0.08s ease, opacity 0.12s ease; cursor: pointer; }
    button:active:not(:disabled) { transform: scale(0.95); }
    button:disabled, .btn-busy { opacity: 0.45 !important; pointer-events: none !important; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* መግቢያ */
    .gate { position: fixed; inset: 0; z-index: 900; background: radial-gradient(circle at top, #172554 0%, #060a12 72%); display: flex; align-items: center; justify-content: center; padding: 16px; }
    .gate-card { width: 100%; max-width: 370px; background: rgba(15, 23, 42, 0.96); border: 1px solid var(--border-strong); border-radius: 24px; padding: 24px 20px; display: flex; flex-direction: column; gap: 11px; box-shadow: 0 24px 50px rgba(0,0,0,0.8); }
    .gate-mark { width: 58px; height: 58px; margin: 0 auto; border-radius: 16px; border: 2px solid var(--teal); background: var(--surface-deep); color: var(--teal); font-size: 24px; font-weight: 900; display: flex; align-items: center; justify-content: center; }
    .gate-title { text-align: center; font-size: 17px; font-weight: 900; }
    .gate-pin { height: 46px; text-align: center; font-size: 22px; letter-spacing: 8px; -webkit-text-security: disc; }

    /* ዋና ቅርፊት */
    .shell { max-width: 1120px; height: 100vh; height: 100dvh; margin: 0 auto; display: none; flex-direction: column; position: relative; overflow: hidden; }
    .topbar { background: rgba(6, 10, 18, 0.96); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 7px 9px; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; z-index: 40; }
    .topbar-row { display: flex; align-items: center; gap: 6px; }
    .icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--teal); font-size: 14px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .icon-btn.sm { width: 29px; height: 29px; font-size: 12px; border-radius: 8px; }
    .icon-btn.on { background: rgba(20, 184, 166, 0.24); border-color: var(--teal); color: #fff; }
    .icon-btn.locked { background: rgba(239,68,68,0.22); border-color: var(--rose); color: #fca5a5; }
    .search-wrap { position: relative; flex: 1; min-width: 0; }
    .search-inp { width: 100%; height: 34px; padding: 0 28px 0 11px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-size: 12px; font-weight: 700; outline: none; }
    .search-inp:focus { border-color: var(--teal); }
    .search-clear { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: transparent; border: none; color: var(--muted); font-size: 13px; padding: 4px; }
    .sync-pill { display: none; height: 30px; padding: 0 9px; border-radius: 15px; border: 1px solid var(--amber); background: rgba(245,158,11,0.2); color: #fde68a; font-size: 10.5px; font-weight: 900; flex-shrink: 0; }
    .scope-sel { height: 30px; max-width: 148px; padding: 0 7px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--teal); font-size: 11px; font-weight: 900; outline: none; flex-shrink: 0; }

    /* ንዑስ ታቦች */
    .subtabs { display: flex; align-items: center; gap: 5px; overflow-x: auto; flex: 1; min-width: 0; }
    .subtab { height: 29px; padding: 0 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 800; white-space: nowrap; flex-shrink: 0; }
    .subtab.active { background: var(--teal); border-color: var(--teal); color: var(--teal-dark); font-weight: 900; }

    /* ጎን ሜኑ */
    .drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.78); backdrop-filter: blur(4px); z-index: 600; display: none; }
    .drawer { position: fixed; top: 0; left: -300px; width: 286px; height: 100%; background: #070c16; border-right: 1px solid var(--border-strong); z-index: 601; transition: left 0.22s ease; display: flex; flex-direction: column; padding: 14px 12px; gap: 8px; }
    .drawer.open { left: 0; }
    .drawer-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--border); gap: 8px; }
    .drawer-brand { display: flex; flex-direction: column; min-width: 0; }
    .drawer-brand b { font-size: 14px; font-weight: 900; color: var(--teal); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drawer-brand small { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drawer-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
    .drawer-item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 11px; border-radius: 11px; border: 1px solid transparent; background: transparent; color: var(--text); font-size: 12.5px; font-weight: 800; text-align: left; }
    .drawer-item.active { background: rgba(20,184,166,0.16); border-color: rgba(20,184,166,0.4); color: #5eead4; }
    .drawer-foot { border-top: 1px solid var(--border); padding-top: 10px; display: flex; flex-direction: column; gap: 7px; }
    .badge-cnt { background: var(--rose); color: #fff; font-size: 10px; font-weight: 900; padding: 1px 7px; border-radius: 10px; }

    /* ዋና የስራ ክፍል */
    .viewport { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 9px 9px 96px; display: flex; flex-direction: column; gap: 9px; }
    .task-banner { display: none; background: rgba(14,165,233,0.12); border: 1px solid rgba(14,165,233,0.42); border-radius: 14px; padding: 9px; flex-direction: column; gap: 6px; }

    /* ካርዶች፣ ቅጾች እና ቁልፎች */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 15px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card-row { display: flex; justify-content: space-between; align-items: center; gap: 7px; flex-wrap: wrap; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
    .kpi { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--teal); border-radius: 14px; padding: 11px 13px; display: flex; flex-direction: column; gap: 3px; }
    .kpi.cyan { border-left-color: var(--primary); }
    .kpi.emerald { border-left-color: var(--emerald); }
    .kpi.amber { border-left-color: var(--amber); }
    .kpi.rose { border-left-color: var(--rose); }
    .kpi-lbl { font-size: 10.5px; font-weight: 800; color: var(--muted); }
    .kpi-val { font-size: 18px; font-weight: 900; font-family: ui-monospace, monospace; color: var(--text); }
    .kpi-sub { font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace; }

    .seg { display: flex; gap: 5px; align-items: center; }
    .seg-btn { flex: 1; height: 32px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--muted); font-size: 11px; font-weight: 900; }
    .seg-btn.out { background: #3b0a0a; border-color: var(--rose); color: #fca5a5; }
    .seg-btn.in { background: #052e16; border-color: var(--emerald); color: #86efac; }
    .seg-btn.teal { background: var(--teal-dark); border-color: var(--teal); color: #99f6e4; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 8px; }
    .inp, .sel, .txtarea { width: 100%; height: 35px; padding: 0 9px; border-radius: 9px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-size: 12px; font-weight: 700; outline: none; }
    .inp.sm { height: 30px; font-size: 11.5px; padding: 0 7px; }
    .txtarea { height: 110px; padding: 9px; resize: vertical; font-family: ui-monospace, monospace; font-size: 11px; }
    .inp:focus, .sel:focus, .txtarea:focus { border-color: var(--teal); }
    .inp.mono { font-family: ui-monospace, monospace; }
    .lbl { display: block; font-size: 10px; font-weight: 800; color: var(--muted); margin-bottom: 3px; }
    .btn { height: 35px; padding: 0 13px; border-radius: 10px; border: none; font-size: 12px; font-weight: 900; color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; }
    .btn.sm { height: 29px; padding: 0 10px; font-size: 11px; border-radius: 8px; }
    .btn.teal { background: var(--teal); color: var(--teal-dark); }
    .btn.primary { background: var(--primary); color: #041d2e; }
    .btn.emerald { background: var(--emerald); color: #022c22; }
    .btn.amber { background: var(--amber); color: #271500; }
    .btn.danger { background: var(--rose); color: #fff; }
    .btn.hard-del { background: #7f1d1d; border: 1px solid var(--rose); color: #fecaca; }
    .btn.muted { background: #1e293b; color: var(--text); border: 1px solid var(--border-strong); }
    .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border-strong); }
    .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 8px; font-size: 10px; font-weight: 800; background: var(--surface-deep); border: 1px solid var(--border-strong); color: var(--text); }
    .pill.teal { background: rgba(20,184,166,0.16); border-color: rgba(20,184,166,0.45); color: #5eead4; }
    .pill.amber { background: rgba(245,158,11,0.16); border-color: rgba(245,158,11,0.45); color: #fde68a; }
    .pill.rose { background: rgba(239,68,68,0.16); border-color: rgba(239,68,68,0.45); color: #fca5a5; }
    .pill.emerald { background: rgba(16,185,129,0.16); border-color: rgba(16,185,129,0.45); color: #6ee7b7; }

    /* ፈጣን መመዝገቢያ ካርዶች እና ቅርጫት */
    .tile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 6px; }
    .tile { background: var(--surface-deep); border: 1px solid var(--border-strong); border-radius: 11px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
    .tile.picked { border-color: var(--emerald); background: rgba(6, 78, 59, 0.34); }
    .basket-row { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 13px; background: var(--surface-deep); border: 1px solid var(--border-strong); }
    .basket-row.dragging { border-color: var(--teal); background: rgba(20,184,166,0.22); transform: scale(1.01); }
    .drag-handle { width: 26px; height: 26px; border-radius: 13px; background: var(--primary); color: #041d2e; font-size: 11px; font-weight: 900; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; touch-action: none; cursor: grab; }

    /* ሠንጠረዦች */
    .tbl-wrap { background: var(--surface); border: 1px solid var(--border-strong); border-radius: 13px; overflow: auto; max-height: 58vh; }
    table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 11px; white-space: nowrap; }
    table.tbl th { position: sticky; top: 0; z-index: 4; background: var(--surface-deep); color: var(--primary); padding: 8px 7px; border-bottom: 1.5px solid var(--border-strong); border-right: 1px solid var(--border); text-align: left; font-size: 10px; font-weight: 900; }
    table.tbl td { padding: 7px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); font-weight: 700; }
    table.tbl tfoot td { position: sticky; bottom: 0; background: var(--surface-deep); border-top: 2px solid rgba(20,184,166,0.45); font-weight: 900; font-family: ui-monospace, monospace; }
    tr.r-in { background: rgba(16,185,129,0.12); }
    tr.r-void { background: rgba(239,68,68,0.16); color: #fca5a5; }
    tr.r-adj { background: rgba(14,165,233,0.14); }
    tr.r-zero { background: rgba(245,158,11,0.16); }
    tr.r-cat { background: #123325; color: #6ee7b7; cursor: pointer; font-weight: 900; }
    tr.r-cat.cat-sel { background: #0369a1 !important; color: #fff !important; }
    tr.r-sel { background: rgba(14,165,233,0.28) !important; }
    tr.r-sel td:first-child { border-left: 3px solid var(--emerald); }
    tr.r-sp td { height: 7px; padding: 0; background: var(--bg); border: none; }
    .num { text-align: right !important; font-family: ui-monospace, monospace; }
    .ctr { text-align: center !important; }

    /* ዘመናዊ የቆጠራ መድረክ (v12 Pro Tally Engine) */
    .preset-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .preset-btn { height: 30px; border-radius: 8px; border: 1px solid var(--border-strong); background: var(--surface-deep); color: var(--text); font-family: ui-monospace, monospace; font-size: 10.5px; font-weight: 900; }
    .preset-btn.active { background: var(--teal); border-color: #5eead4; color: var(--teal-dark); }
    .alert-box { padding: 6px 10px; border-radius: 10px; text-align: center; font-size: 11px; font-weight: 900; }
    .alert-box.warn { background: rgba(245,158,11,0.22); border: 1.5px solid var(--amber); color: #fde68a; }
    .alert-box.stop { background: var(--emerald); color: #022c22; }
    .alert-box.over { background: rgba(14,165,233,0.18); border: 1.5px solid var(--primary); color: #7dd3fc; }

    .t-stage { position: relative; background: radial-gradient(circle at 50% 0%, rgba(20,184,166,0.09) 0%, var(--surface-deep) 68%); border: 1.5px solid var(--border-strong); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; transition: border-color 0.25s ease, box-shadow 0.45s ease; }
    .t-stage.glow-ok { border-color: var(--emerald); box-shadow: inset 0 0 22px rgba(16,185,129,0.28), 0 0 14px rgba(16,185,129,0.25); }
    .t-stage.glow-batch { border-color: var(--amber); box-shadow: inset 0 0 26px rgba(245,158,11,0.34), 0 0 16px rgba(245,158,11,0.3); }
    .t-stage.done { border-color: var(--emerald); }
    .t-stage.near { border-color: var(--amber); }
    .t-prog-track { width: 100%; height: 4px; background: rgba(148,163,184,0.14); }
    .t-prog-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal), var(--emerald)); transition: width 0.2s ease; }
    .t-stats-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 7px 6px 6px; background: rgba(15,23,42,0.88); border-bottom: 1px solid var(--border); }
    .t-kpi { background: rgba(6,10,18,0.6); border: 1px solid var(--border); border-radius: 9px; padding: 4px; display: flex; flex-direction: column; align-items: center; }
    .t-kpi-lbl { font-size: 8.5px; font-weight: 800; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .t-kpi-val { font-family: ui-monospace, monospace; font-size: 16.5px; font-weight: 900; line-height: 1.18; }
    .t-kpi-val.sm { font-size: 12px; }
    .t-visual { min-height: 120px; max-height: 220px; overflow-y: auto; padding: 9px 10px; display: flex; flex-direction: column; justify-content: center; gap: 7px; }
    .t-visual.tally-mode { justify-content: flex-start; }
    .batch-summary { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: rgba(15,23,42,0.85); border: 1px solid var(--border); border-radius: 10px; padding: 5px 10px; font-size: 10.5px; font-weight: 900; }
    .dot-ring { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; padding: 3px 4px; }
    .b-dot { height: 34px; border-radius: 11px; border: 1.5px solid var(--border-strong); background: rgba(15,23,42,0.65); display: flex; align-items: center; justify-content: center; font-family: ui-monospace, monospace; font-size: 11px; font-weight: 900; color: var(--muted); transition: transform 0.14s ease; }
    .b-dot.filled { background: rgba(16,185,129,0.22); border-color: var(--emerald); color: #a7f3d0; }
    .b-dot.odd { background: rgba(245,158,11,0.24); border-color: var(--amber); color: #fde68a; }
    .b-dot.latest { transform: scale(1.06); box-shadow: 0 0 12px rgba(20,184,166,0.45); border-color: #5eead4; }
    .b-dot.w0 { background: rgba(14,165,233,0.25); border-color: var(--primary); color: #bae6fd; }
    .b-dot.w1 { background: rgba(16,185,129,0.25); border-color: var(--emerald); color: #a7f3d0; }
    .b-dot.w2 { background: rgba(245,158,11,0.25); border-color: var(--amber); color: #fde68a; }
    .b-dot.w3 { background: rgba(168,85,247,0.25); border-color: var(--violet); color: #e9d5ff; }
    .tally-compact-bar { background: rgba(20,184,166,0.14); border: 1px solid var(--teal); border-radius: 8px; padding: 4px 9px; font-size: 10.5px; font-weight: 900; color: #99f6e4; text-align: center; }
    .tally-row-5 { display: grid; grid-template-columns: repeat(5, 1fr) 44px; align-items: center; gap: 4px; padding: 2px 0; border-bottom: 1px dashed rgba(51,65,85,0.45); }
    .tally-row-tot { font-family: ui-monospace, monospace; font-size: 9.5px; font-weight: 900; color: var(--muted); text-align: right; }
    .t-grp { position: relative; width: 38px; height: 34px; margin: 0 auto; display: inline-flex; align-items: center; justify-content: center; }
    .t-bar { width: 3.5px; height: 26px; background: var(--emerald); margin: 0 2px; border-radius: 2px; }
    .t-bar.odd { background: var(--amber); }
    .t-slash { position: absolute; width: 40px; height: 3.5px; background: var(--amber); border-radius: 2px; transform: rotate(-28deg); }
    .cadence-bar { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 5px 10px; background: rgba(6,10,18,0.72); border-top: 1px solid var(--border); font-size: 10px; font-weight: 800; }
    .cadence-timer { font-family: ui-monospace, monospace; font-weight: 900; color: #5eead4; white-space: nowrap; }
    .cadence-timer.stale { color: var(--muted); }
    .cadence-pills { display: flex; gap: 4px; overflow: hidden; }
    .c-pill { padding: 2px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border-strong); font-family: ui-monospace, monospace; font-size: 9.5px; color: var(--muted); }
    .c-pill.fast { border-color: var(--amber); color: #fde68a; background: rgba(245,158,11,0.16); }
    .t-pause-mask { position: absolute; inset: 0; z-index: 20; background: rgba(6,10,18,0.93); backdrop-filter: blur(5px); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px; text-align: center; }
    .t-pause-mask.open { display: flex; }

    /* የመቁጠሪያ ቁልፎች (መንሸራተቻ፣ ተቀያያሪ፣ ሰፊ፣ ባለብዙ-ተሸካሚ) */
    .sg-track { position: relative; height: 54px; border-radius: 27px; background: linear-gradient(90deg, rgba(15,23,42,0.96), rgba(4,47,46,0.9)); border: 2px solid var(--teal); overflow: hidden; touch-action: none; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 2px 10px rgba(0,0,0,0.6); }
    .sg-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, rgba(20,184,166,0.28), rgba(16,185,129,0.52)); pointer-events: none; }
    .sg-label { font-size: 12.5px; font-weight: 900; color: #99f6e4; pointer-events: none; z-index: 1; padding-left: 36px; }

    function playTone(freq = 540, dur = 0.06, type = 'sine', vol = 0.12) {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = type; o.frequency.value = freq;
        g.gain.setValueAtTime(vol, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(); o.stop(audioCtx.currentTime + dur);
      } catch {}
    }

    }

    function parseLtzInfo(name) {
      const m = String(name || '').trim().match(/^(\d+(?:\.\d+)?)\s*([LTZ])\s*[×x*]\s*(\d+(?:\.\d+)?)/i);
      if (!m) return null;
      const rank = { L: 1, T: 2, Z: 3 }[m[2].toUpperCase()] || 9;
      return { size: parseFloat(m[1]), thick: parseFloat(m[3]), rank, groupKey: `${m[1]}_${m[3]}` };
    }

    function compareItemsSmart(aName, bName, catName = '') {
      const la = parseLtzInfo(aName), lb = parseLtzInfo(bName);
      if (/ltz/i.test(catName) || (la && lb)) {
        if (la && lb) {
          if (la.size !== lb.size) return la.size - lb.size;
          if (la.thick !== lb.thick) return la.thick - lb.thick;
          if (la.rank !== lb.rank) return la.rank - lb.rank;
        } else if (la) return -1;
        else if (lb) return 1;
      }
      const ta = String(aName || '').toLowerCase().match(/(\d+(?:\.\d+)?|\D+)/g) || [];
      const tb = String(bName || '').toLowerCase().match(/(\d+(?:\.\d+)?|\D+)/g) || [];
      const len = Math.max(ta.length, tb.length);
      for (let i = 0; i < len; i++) {
        if (ta[i] === undefined) return -1;
        if (tb[i] === undefined) return 1;
        const na = parseFloat(ta[i]), nb = parseFloat(tb[i]);
        if (!isNaN(na) && !isNaN(nb)) { if (na !== nb) return na - nb; }
        else { const c = ta[i].localeCompare(tb[i]); if (c !== 0) return c; }
      }
      return 0;
    }

      return data;

          'x-session-token': cloudSession.token

    function recalcWhItemChain(branch, itemId) {
      const it = state.inventory.find((x) => x.id === itemId);
      if (!it || !branch) return;
      const rows = state.warehouseLedger.filter((r) => r.branch === branch && r.itemId === itemId);
      if (!rows.length) return;
      const firstValid = rows.find((r) => r.status === 'valid');
      let running = firstValid ? Number(firstValid.openBal || 0) : Number(it.branchStock[branch] || 0);
      rows.forEach((r) => {
        if (r.status === 'void') { r.openBal = 0; r.endBal = 0; }
        else {
          r.openBal = running;
          running = Math.max(0, running + Number(r.inQty || 0) - Number(r.outQty || 0));
          r.endBal = running;
        }
      });
      it.branchStock[branch] = running;

    async function doGateLogin(btn) {
      const errEl = document.getElementById('gateErr');
      const pin = document.getElementById('inpGatePin').value.trim();
      if (!pin) { errEl.textContent = t('errPin'); return; }

      await withBusy(btn, async () => {
        errEl.textContent = '';
        if (loginMode === 'CLOUD' && navigator.onLine) {
          const orgCode = (document.getElementById('inpGateOrg').value || 'KORA').trim().toUpperCase();
          try {
            const res = await cloudRpc('rpc_login_pin', { p_org_code: orgCode, p_pin: pin });
            if (res && res.success) {
              cloudSession = res;
              saveJson(CLOUD_SESS_KEY, cloudSession);
              if (res.organization) {
                state.org.amName = res.organization.am_name || state.org.amName;
                state.org.amTag = res.organization.am_tagline || state.org.amTag;
                state.org.enName = res.organization.en_name || state.org.enName;
                state.org.enTag = res.organization.en_tagline || state.org.enTag;
                state.vatRate = Number(res.organization.vat_rate ?? state.vatRate);
              }
              const localMatch = state.users.find((u) => u.roleKey === res.user?.role_key) || state.users[0];
              if (localMatch) state.activeUserId = localMatch.id;
              state.loggedIn = true;
              saveState();
              document.getElementById('inpGatePin').value = '';
              enterApp();
              return;
            }
          } catch {}
        }

        // የአካባቢ / ኦፍላይን ፈጣን ማረጋገጫ
        const chosenId = Number(document.getElementById('selGateUser')?.value || state.activeUserId);
        const match = loginMode === 'LOCAL'
          ? state.users.find((u) => u.id === chosenId && u.pin === pin)
          : state.users.find((u) => u.pin === pin);

        if (!match) {
          errEl.textContent = t('errPin');
          vib([50, 30, 50]);
          return;
        }
        state.activeUserId = match.id;
        state.loggedIn = true;
        saveState();
        document.getElementById('inpGatePin').value = '';
        enterApp();
      });
    }

    function computeBankMetrics() {
      return state.banks.map((b) => {
        let inflow = 0, outflow = 0;
        state.salesLedger.filter((s) => s.status === 'valid').forEach((s) => {
          (s.payments || []).forEach((p) => { if (p.method === b.name) inflow += Number(p.amount || 0); });
        });
        state.purchasesLedger.forEach((p) => {
          (p.payments || []).forEach((py) => { if (py.method === b.name) outflow += Number(py.amount || 0); });
        });
        state.expensesLedger.forEach((e) => { if (e.bank === b.name) outflow += Number(e.amount || 0); });
        const ending = Number(b.opening || 0) + inflow - outflow;
        return { ...b, inflow, outflow, ending };
      });
    }

    function getPeriodRange(period) {
      const now = new Date();
      const end = new Date().toISOString().slice(0, 10);
      if (period === 'WEEK') return { start: getWeekStartDateStr(), end };
      if (period === 'LAST_WEEK') {
        const d = new Date(getWeekStartDateStr());
        const prevEnd = new Date(d.getTime() - 86400000);
        const prevStart = new Date(d.getTime() - 7 * 86400000);
        return { start: prevStart.toISOString().slice(0, 10), end: prevEnd.toISOString().slice(0, 10) };
      }
      if (period === 'MONTH') return { start: `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-01`, end };
      return { start: '2000-01-01', end: '2099-12-31' };
    }

    function computePeriodStockRows(period) {
      const range = getPeriodRange(period);
      const br = state.branchScope;
      return state.inventory.map((it) => {
        const curQty = getItemStock(it, br);
        let inQ = 0, outQ = 0, adjQ = 0;
        state.warehouseLedger.forEach((r) => {
          if (r.status !== 'valid' || r.itemId !== it.id) return;
          if (br !== 'all' && r.branch !== br) return;
          if (r.date < range.start || r.date > range.end) return;
          if (r.type === 'ADJ') adjQ += Number(r.inQty || 0) - Number(r.outQty || 0);
          else { inQ += Number(r.inQty || 0); outQ += Number(r.outQty || 0); }
        });
        const openQ = Math.max(0, curQty - inQ + outQ - adjQ);
        return { ...it, openQ, inQ, outQ, adjQ, curQty };
      });
    }

    function renderSmartAnalytics(root) {
      const cfg = state.analyticsCfg;
      const win = Math.max(7, Number(cfg.windowDays || 30));
      const lead = Math.max(1, Number(cfg.leadDays || 7));
      const cover = Math.max(3, Number(cfg.coverDays || 21));
      const br = state.branchScope;
      const cutoff = Date.now() - win * 86400000;

      const outMap = {}, revMap = {};
      state.warehouseLedger.forEach((r) => {
        if (r.status !== 'valid' || r.type !== 'OUT') return;
        if (br !== 'all' && r.branch !== br) return;
        const ts = new Date(r.date).getTime();
        if (!isNaN(ts) && ts < cutoff) return;
        outMap[r.itemId] = (outMap[r.itemId] || 0) + Number(r.outQty || 0);
      });
      state.salesLedger.forEach((s) => {
        if (s.status !== 'valid') return;
        if (br !== 'all' && s.branch !== br) return;
        const ts = new Date(s.date).getTime();
        if (!isNaN(ts) && ts < cutoff) return;
        if (!revMap[s.itemId]) revMap[s.itemId] = { rev: 0, prof: 0 };
        revMap[s.itemId].rev += Number(s.total || 0);
        revMap[s.itemId].prof += Number(s.profit || 0);
      });

      const items = state.inventory.map((i) => {
        const stock = getItemStock(i, br);
        const outQty = outMap[i.id] || 0;
        const burn = Number((outQty / win).toFixed(2));
        const daysLeft = burn > 0 ? Number((stock / burn).toFixed(1)) : null;
        const suggest = Math.max(0, Math.ceil(burn * (lead + cover) - stock));
        const urgent = (daysLeft !== null && daysLeft <= lead) || (stock <= 0 && outQty > 0);
        const soon = !urgent && daysLeft !== null && daysLeft <= lead + 7;
        const isDead = outQty <= 0 && stock > 0;
        return {
          ...i, stock, outQty, burn, daysLeft, suggest, urgent, soon, isDead,
          rev: revMap[i.id]?.rev || 0, prof: revMap[i.id]?.prof || 0,
          estBudget: suggest * Number(i.landedCost || 0),
          lockedCap: stock * Number(i.landedCost || 0)
        };
      });

      const totRev = items.reduce((a, b) => a + b.rev, 0);
      let cum = 0;
      items.slice().sort((a, b) => b.rev - a.rev).forEach((x) => {
        cum += x.rev;
        const sh = totRev > 0 ? cum / totRev : 1;
        x.tier = totRev <= 0 ? 'C' : (sh <= 0.75 ? 'A' : (sh <= 0.93 ? 'B' : 'C'));
      });

      const reorders = items.filter((x) => x.suggest > 0 && (x.urgent || x.soon))
        .sort((a, b) => Number(b.urgent) - Number(a.urgent) || (a.daysLeft ?? 9999) - (b.daysLeft ?? 9999));
      const fast = items.filter((x) => x.outQty > 0).sort((a, b) => b.outQty - a.outQty).slice(0, 12);
      const dead = items.filter((x) => x.isDead).sort((a, b) => b.lockedCap - a.lockedCap).slice(0, 15);
      const totBudget = reorders.reduce((a, b) => a + b.estBudget, 0);
      const totDeadCap = dead.reduce((a, b) => a + b.lockedCap, 0);

      let creditBlock = '';
      if (hasPerm('banks') || hasPerm('sellPrice')) {
        let b1 = 0, b2 = 0, b3 = 0;
        const overdueList = [];
        state.creditLedger.forEach((c) => {
          const rem = Math.max(0, c.total - c.paid);
          if (rem <= 0 || c.type !== 'receivable') return;
          const days = c.dueDate ? Math.max(0, Math.floor((Date.now() - new Date(c.dueDate).getTime()) / 86400000)) : 0;
          if (days > 0) {

              <div class="kpi rose"><span class="kpi-lbl">${esc(t('anBucket3'))}</span><span class="kpi-val">${fmtMoney(b3)}</span></div>
            </div>

                  <tbody>${overdueList.map((c) => `<tr><td><b>${esc(c.party)}</b> (${esc(c.docNo)})</td><td class="ctr"><span class="pill rose">${c.days} ${esc(t('daysUnit'))}</span></td><td class="num" style="color:var(--rose);">${fmtMoney(c.rem)}</td></tr>`).join('')}</tbody>

        <div class="kpi-grid">
          <div class="kpi rose"><span class="kpi-lbl">${esc(t('anCritReorder'))}</span><span class="kpi-val">${reorders.filter((x) => x.urgent).length}</span></div>
          <div class="kpi cyan"><span class="kpi-lbl">${esc(t('anBudget'))}</span><span class="kpi-val">${hasPerm('costPrice') ? fmtMoney(totBudget) : esc(t('hiddenVal'))}</span></div>
          <div class="kpi amber"><span class="kpi-lbl">${esc(t('anDeadCount'))}</span><span class="kpi-val">${dead.length}</span></div>

                </tr>

              <tbody>
                ${reorders.map((r) => `

              <thead><tr><th>${esc(t('item'))}</th><th class="ctr">${esc(t('endingBal'))}</th>${hasPerm('costPrice') ? `<th class="num">${esc(t('anDeadCap'))}</th>` : ''}</tr></thead>
              <tbody>
                ${dead.map((r) => `<tr><td><b>${esc(r.name)}</b></td><td class="ctr">${fmtNum(r.stock)} ${esc(getUnitLabel(r))}</td>${hasPerm('costPrice') ? `<td class="num" style="color:var(--rose);">${fmtMoney(r.lockedCap)}</td>` : ''}</tr>`).join('') || `<tr><td colspan="3" class="ctr" style="padding:14px;color:var(--emerald);">${esc(t('anHealthy'))}</td></tr>`}
              </tbody>
            </table>
          </div>
        </div>
        ${creditBlock}`;
    }

    // -------------------------------------------------------------------------
    // 4. ግብይት (ሽያጭ፣ ግዢ እና ዱቤ)
    // -------------------------------------------------------------------------
    function renderTrade(sub) {
      const root = document.getElementById('viewRoot');
      const q = (document.getElementById('globalSearch')?.value || '').trim().toLowerCase();
      const br = state.branchScope;

      if (sub === 'sales') {
        const list = state.salesLedger.slice().reverse().filter((s) => {
          if (br !== 'all' && s.branch !== br) return false;
          if (q && !`${s.invNo} ${s.customer} ${s.itemName}`.toLowerCase().includes(q)) return false;
          return true;
        });
        root.innerHTML = `
          <div class="card-row">
            <button type="button" class="btn teal sm" onclick="openSaleModal()">+ ${esc(t('newSale'))}</button>
            <span class="pill">${fmtNum(list.length)}</span>
          </div>
          <div class="cards-grid">
            ${list.map((s) => {
              const isV = s.status === 'void';
              const payTxt = (s.payments || []).map((p) => `${p.method}: ${fmtNum(p.amount)}`).join(' · ');
              return `
                <div class="card" style="${isV ? 'opacity:0.6;border-color:var(--rose);' : ''}">
                  <div class="card-row">
                    <b style="font-family:ui-monospace,monospace;color:var(--teal);">${esc(s.invNo)}</b>
                    <span class="pill ${isV ? 'rose' : 'emerald'}">${esc(isV ? t('voidWord') : s.branch)}</span>
                  </div>
                  <b>${esc(s.customer)}</b>
                  <div style="font-size:11.5px;color:var(--muted);">${esc(s.itemName)} · ${fmtNum(s.qty)} ${esc(s.unit)}</div>
                  <div class="card-row">
                    <b style="font-family:ui-monospace,monospace;font-size:14px;">${fmtMoney(s.total)}</b>
                    ${hasPerm('profit') && !isV ? `<span class="pill emerald">+${fmtMoney(s.profit)}</span>` : ''}
                  </div>
                  <div style="font-size:10.5px;color:var(--muted);">${esc(payTxt)} · ${esc(s.date)}</div>
                  ${hasPerm('editVoid') ? `<button type="button" class="btn sm ${isV ? 'teal' : 'danger'}" onclick="toggleSaleVoid(${s.id})">${esc(isV ? t('unvoidWord') : t('voidWord'))}</button>` : ''}
                </div>`;
            }).join('') || `<div class="card" style="text-align:center;color:var(--muted);">${esc(t('noData'))}</div>`}
          </div>`;
        return;
      }

      if (sub === 'purchases') {
        const list = state.purchasesLedger.slice().reverse().filter((p) => {
          if (br !== 'all' && p.branch !== br) return false;
          if (q && !`${p.purNo} ${p.supplier} ${p.itemName}`.toLowerCase().includes(q)) return false;
          return true;
        });
        root.innerHTML = `
          <div class="card-row">
            <button type="button" class="btn primary sm" onclick="openPurchaseModal()">+ ${esc(t('newPurchase'))}</button>
            <span class="pill">${fmtNum(list.length)}</span>
          </div>
          <div class="cards-grid">
            ${list.map((p) => `
              <div class="card">
                <div class="card-row">
                  <b style="font-family:ui-monospace,monospace;color:var(--primary);">${esc(p.purNo)}</b>
                  <span class="pill ${p.status === 'pending' ? 'amber' : 'emerald'}">${esc(p.status === 'pending' ? t('pendingInbound') : p.branch)}</span>
                </div>
                <b>${esc(p.supplier)}</b>
                <div style="font-size:11.5px;color:var(--muted);">${esc(p.itemName)} · ${fmtNum(p.qty)} ${esc(p.unit)}</div>
                <div class="card-row">
                  <b style="font-family:ui-monospace,monospace;">${fmtMoney(p.total)}</b>
                  ${hasPerm('costPrice') ? `<span class="pill">${esc(t('costPrice'))}: ${fmtNum(p.landedUnit)}</span>` : ''}
                </div>
                <div style="font-size:10.5px;color:var(--muted);">${esc((p.payments || []).map((x) => `${x.method}: ${fmtNum(x.amount)}`).join(' · '))}</div>
                ${p.status === 'pending' ? `<button type="button" class="btn emerald sm" onclick="receivePendingPurchase(${p.id})">${esc(t('receiveNow'))}</button>` : ''}
              </div>`).join('') || `<div class="card" style="text-align:center;color:var(--muted);">${esc(t('noData'))}</div>`}
          </div>`;
        return;
      }

      // ዱቤ
      const list = state.creditLedger.filter((c) => !q || `${c.docNo} ${c.party} ${c.items}`.toLowerCase().includes(q));
      const recTot = list.filter((c) => c.type === 'receivable').reduce((a, c) => a + Math.max(0, c.total - c.paid), 0);
      const payTot = list.filter((c) => c.type === 'payable').reduce((a, c) => a + Math.max(0, c.total - c.paid), 0);
      const todayIso = new Date().toISOString().slice(0, 10);

      root.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi emerald"><span class="kpi-lbl">${esc(t('receivable'))}</span><span class="kpi-val">${fmtMoney(recTot)}</span></div>
          <div class="kpi rose"><span class="kpi-lbl">${esc(t('payable'))}</span><span class="kpi-val">${hasPerm('banks') ? fmtMoney(payTot) : esc(t('hiddenVal'))}</span></div>
        </div>
        <div class="card-row">
          <button type="button" class="btn amber sm" onclick="openCreditModal()">+ ${esc(t('newCredit'))}</button>
        </div>
        <div class="cards-grid">
          ${list.map((c) => {
            const rem = Math.max(0, c.total - c.paid);
            const isOver = rem > 0 && c.dueDate && c.dueDate < todayIso;
            const isRec = c.type === 'receivable';
            return `
              <div class="card" style="${isOver ? 'border-color:var(--rose);' : ''}">
                <div class="card-row">
                  <span class="pill ${isRec ? 'emerald' : 'amber'}">${esc(isRec ? t('receivable') : t('payable'))}</span>
                  <span class="pill ${rem === 0 ? 'teal' : (isOver ? 'rose' : '')}">${esc(rem === 0 ? t('paidDone') : (isOver ? t('overdue') : c.dueDate || '-'))}</span>
                </div>
                <b>${esc(c.party)} <small style="color:var(--muted);font-family:ui-monospace,monospace;">(${esc(c.docNo)})</small></b>
                <div style="font-size:11px;color:var(--muted);">${esc(c.items || '-')}</div>
                <div style="display:flex;justify-content:space-between;font-family:ui-monospace,monospace;font-size:12px;">
                  <span>${esc(t('paidAmt'))}: ${fmtNum(c.paid)}</span>
                  <b style="color:${rem > 0 ? 'var(--amber)' : 'var(--emerald)'};">${esc(t('remainingAmt'))}: ${fmtMoney(rem)}</b>
                </div>
                ${rem > 0 ? `
                  <div style="display:flex;gap:5px;flex-wrap:wrap;">
                    ${isRec ? `<button type="button" class="btn teal sm" onclick="openCreditActionModal(${c.id},'collect')">${esc(t('collectPay'))}</button>` : ''}
                    ${!isRec && hasPerm('approve') && c.status !== 'approved' ? `<button type="button" class="btn amber sm" onclick="openCreditActionModal(${c.id},'approve')">${esc(t('approvePay'))}</button>` : ''}
                    ${!isRec && hasPerm('pay') && c.status === 'approved' ? `<button type="button" class="btn emerald sm" onclick="openCreditActionModal(${c.id},'pay')">${esc(t('executePay'))}</button>` : ''}
                    ${isRec ? `<button type="button" class="btn muted sm" onclick="remindCreditParty(${c.id})">${esc(t('remind'))}</button>` : ''}
                  </div>` : ''}
              </div>`;
          }).join('') || `<div class="card" style="text-align:center;color:var(--muted);">${esc(t('noData'))}</div>`}
        </div>`;
    }

    // --- የሽያጭ ቅጽ ሞዳል (ከድርድር ጣሪያና ከተከፋፈለ ክፍያ ጋር) ---
    function openSaleModal() {
      const defItem = state.inventory[0];
      const defBr = state.branchScope !== 'all' ? state.branchScope : (state.branches[0]?.name || '');
      const defBank = state.banks[0]?.name || t('creditMethod');
      saleDraft = {
        invNo: 'INV-' + (1000 + state.salesLedger.length + 1),
        customer: '',
        direct: false,
        dueDate: new Date(Date.now() + 14 * 86400000).toISOString().slice(0, 10),
        lines: defItem ? [{ itemId: defItem.id, branch: defBr, qty: 1, price: defItem.sellPrice }] : [],
        payments: [{ method: defBank, amount: defItem ? defItem.sellPrice : 0 }]
      };
      renderSaleModal();
    }

    function calcSaleTotals() {
      const sub = (saleDraft?.lines || []).reduce((a, l) => a + Number(l.qty || 0) * Number(l.price || 0), 0);
      const vat = state.cfg.vat ? Math.round(sub * (Number(state.vatRate || 0) / 100)) : 0;
      const grand = sub + vat;
      const paid = (saleDraft?.payments || []).reduce((a, p) => a + Number(p.amount || 0), 0);
      return { sub, vat, grand, paid, rem: grand - paid };
    }

    function renderSaleModal() {
      const tot = calcSaleTotals();
      const payOpts = [...state.banks.map((b) => b.name), t('creditMethod')];

      const linesHtml = saleDraft.lines.map((l, idx) => {
        const it = state.inventory.find((x) => x.id === l.itemId);
        const lowFloor = it && it.floorPrice > 0 && Number(l.price) < it.floorPrice;
        return `
          <div class="sub-card" style="${lowFloor ? 'border-color:var(--rose);' : ''}">
            <div class="card-row">
              <button type="button" class="btn muted sm" style="flex:1;justify-content:flex-start;" onclick="pickSaleLineItem(${idx})">${esc(it ? it.name : t('pickItemTitle'))}</button>
              ${saleDraft.lines.length > 1 ? `<button type="button" class="icon-btn sm" style="color:var(--rose);" onclick="saleDraft.lines.splice(${idx},1);renderSaleModal();">✕</button>` : ''}
            </div>
            <div class="grid-3">
              <select class="sel" onchange="saleDraft.lines[${idx}].branch=this.value;renderSaleModal();" ${saleDraft.direct ? 'disabled' : ''}>
                ${state.branches.map((b) => `<option value="${esc(b.name)}" ${l.branch === b.name ? 'selected' : ''}>${esc(b.name)} (${getItemStock(it, b.name)})</option>`).join('')}
              </select>
              <input type="number" min="1" class="inp mono" value="${l.qty}" placeholder="${esc(t('qty'))}" oninput="saleDraft.lines[${idx}].qty=Math.max(1,Number(this.value||1));syncFirstSalePay();renderSaleTotalsOnly();">
              <input type="number" step="0.01" class="inp mono" value="${l.price}" placeholder="${esc(t('unitPrice'))}" oninput="saleDraft.lines[${idx}].price=Math.max(0,Number(this.value||0));syncFirstSalePay();renderSaleModal();">
            </div>
            ${lowFloor ? `<div style="font-size:10.5px;color:var(--rose);font-weight:900;">⚠️ ${esc(t('errFloor'))} (${fmtNum(it.floorPrice)})</div>` : ''}
          </div>`;
      }).join('');

      const paysHtml = saleDraft.payments.map((p, idx) => `
        <div style="display:grid;grid-template-columns:1fr 110px auto;gap:5px;align-items:center;">
          <select class="sel" onchange="saleDraft.payments[${idx}].method=this.value;renderSaleModal();">
            ${payOpts.map((m) => `<option value="${esc(m)}" ${p.method === m ? 'selected' : ''}>${esc(m)}</option>`).join('')}
          </select>
          <input type="number" min="0" class="inp mono" value="${p.amount}" oninput="saleDraft.payments[${idx}].amount=Math.max(0,Number(this.value||0));renderSaleTotalsOnly();">
          ${saleDraft.payments.length > 1 ? `<button type="button" class="icon-btn sm" style="color:var(--rose);" onclick="saleDraft.payments.splice(${idx},1);renderSaleModal();">✕</button>` : '<span></span>'}
        </div>`).join('');

      openModal(t('newSale'), `
        <div class="grid-2">
          <div><label class="lbl">${esc(t('docNo'))}</label><input class="inp mono" value="${esc(saleDraft.invNo)}" oninput="saleDraft.invNo=this.value"></div>
          <div><label class="lbl">${esc(t('customer'))}</label><input class="inp" value="${esc(saleDraft.customer)}" oninput="saleDraft.customer=this.value"></div>
        </div>
        ${state.cfg.crossDock ? `
          <div class="switch-row" style="padding:4px 0;">
            <span>${esc(t('directDelivery'))}</span>
            <div class="toggle ${saleDraft.direct ? 'on' : ''}" onclick="saleDraft.direct=!saleDraft.direct;renderSaleModal();"></div>
          </div>` : ''}
        ${linesHtml}
        <button type="button" class="btn muted sm" onclick="addSaleLine()">+ ${esc(t('addItemRow'))}</button>
        <div class="sub-card">
          <div class="card-row"><b style="color:var(--teal);">${esc(t('splitPay'))}</b><span id="saleTotBadge" class="pill teal">${fmtMoney(tot.grand)}</span></div>
          ${paysHtml}
          <div style="display:flex;justify-content:space-between;align-items:center;font-size:11px;">
            <button type="button" class="btn ghost sm" onclick="addSalePayRow()">+ ${esc(t('addPayRow'))}</button>
            <span id="saleRemBadge" style="font-family:ui-monospace,monospace;font-weight:900;color:${Math.abs(tot.rem) <= 1 ? 'var(--emerald)' : 'var(--rose)'};">${esc(t('unallocated'))}: ${fmtNum(tot.rem)}</span>
          </div>
          ${saleDraft.payments.some((p) => p.method === t('creditMethod')) ? `<div><label class="lbl">${esc(t('dueDate'))}</label><input type="date" class="inp" value="${esc(saleDraft.dueDate)}" onchange="saleDraft.dueDate=this.value"></div>` : ''}
        </div>`, `
        <button type="button" class="btn muted" onclick="sendSaleDraftToTally()">🧮 ${esc(t('sendToTally'))}</button>
        <button type="button" class="btn teal" onclick="submitSaleDraft(this)">${esc(t('completeSale'))}</button>`);
    }

    function syncFirstSalePay() {
      if (saleDraft && saleDraft.payments.length === 1) {
        saleDraft.payments[0].amount = calcSaleTotals().grand;
      }
    }

    function renderSaleTotalsOnly() {
      const tot = calcSaleTotals();
      const b = document.getElementById('saleTotBadge');
      const r = document.getElementById('saleRemBadge');
      if (b) b.textContent = fmtMoney(tot.grand);
      if (r) {
        r.textContent = `${t('unallocated')}: ${fmtNum(tot.rem)}`;
        r.style.color = Math.abs(tot.rem) <= 1 ? 'var(--emerald)' : 'var(--rose)';
      }
    }

    function pickSaleLineItem(idx) {
      openPicker((itemId) => {
        const it = state.inventory.find((x) => x.id === itemId);
        if (!it || !saleDraft) return;
        saleDraft.lines[idx].itemId = it.id;
        saleDraft.lines[idx].price = it.sellPrice;
        syncFirstSalePay();
        renderSaleModal();
      });
    }

    function addSaleLine() {
      const it = state.inventory[0];
      const br = state.branchScope !== 'all' ? state.branchScope : (state.branches[0]?.name || '');
      saleDraft.lines.push({ itemId: it?.id || 0, branch: br, qty: 1, price: it?.sellPrice || 0 });
      syncFirstSalePay();
      renderSaleModal();
    }

    function addSalePayRow() {
      const tot = calcSaleTotals();
      const nextBank = state.banks[1]?.name || t('creditMethod');
      saleDraft.payments.push({ method: nextBank, amount: Math.max(0, tot.rem) });
      renderSaleModal();
    }

    function sendSaleDraftToTally() {
      if (!saleDraft || !saleDraft.lines.length) return;
      const br = saleDraft.lines[0].branch;
      const id = 'tk_' + Date.now();
      state.tally.tickets.push({
        id, dir: 'OUT', docNo: nextBranchDoc(br), party: saleDraft.customer || '-', branch: br,
        activeItemId: saleDraft.lines[0].itemId,
        items: saleDraft.lines.map((l) => {
          const it = state.inventory.find((x) => x.id === l.itemId);
          return { itemId: l.itemId, name: it?.name || '-', unit: getUnitLabel(it), loc: it?.zoneCode || 'A-01', target: l.qty, strokes: [] };
        })
      });
      state.tally.activeTicketId = id;
      saveState();
      closeModal();
      switchMainTab('tally');
      switchSubTab('tickets');
      showToast(t('savedOk'));
    }

    function submitSaleDraft(btn) {
      if (!saleDraft || !saleDraft.lines.length) return;
      const tot = calcSaleTotals();
      if (tot.grand <= 0) return;
      if (Math.abs(tot.rem) > 1) { showToast(t('errSplit'), true); return; }

      // የክምችት ፍተሻ
      if (!saleDraft.direct) {
        for (const l of saleDraft.lines) {
          const it = state.inventory.find((x) => x.id === l.itemId);
          if (!it || getItemStock(it, l.branch) < l.qty) { showToast(t('errStock'), true); return; }
        }
      }

      // የድርድር ጣሪያ ፍተሻ
      const belowFloor = saleDraft.lines.some((l) => {
        const it = state.inventory.find((x) => x.id === l.itemId);
        return it && it.floorPrice > 0 && Number(l.price) < it.floorPrice;
      });
      if (belowFloor && !isOwner()) {
        verifyPin(true, () => finalizeSaleCommit(btn));
        return;
      }
      finalizeSaleCommit(btn);
    }

    async function finalizeSaleCommit(btn) {
      await withBusy(btn, async () => {
        const tot = calcSaleTotals();
        const today = new Date().toISOString().slice(0, 10);
        const firstBr = saleDraft.lines[0].branch;
        const bDoc = nextBranchDoc(firstBr);
        const cust = saleDraft.customer.trim() || '-';
        const cleanPays = saleDraft.payments.filter((p) => p.amount > 0);
        const creditAmt = cleanPays.filter((p) => p.method === t('creditMethod')).reduce((a, p) => a + p.amount, 0);
        let totalProf = 0;
        const notifItems = [];

        saleDraft.lines.forEach((l, idx) => {
          const it = state.inventory.find((x) => x.id === l.itemId);
          if (!it) return;
          const lineSub = l.qty * l.price;
          const lineVat = state.cfg.vat ? Math.round(lineSub * (state.vatRate / 100)) : 0;
          const lineTot = lineSub + lineVat;
          const lineProf = l.qty * (l.price - Number(it.landedCost || 0));
          totalProf += lineProf;

          if (!saleDraft.direct) {
            const openBal = getItemStock(it, l.branch);
            const endBal = openBal - l.qty;
            it.branchStock[l.branch] = endBal;
            state.warehouseLedger.push({
              id: Date.now() + idx, docNo: bDoc, type: 'OUT', status: 'valid', branch: l.branch,
              itemId: it.id, itemName: it.name, unit: getUnitLabel(it), loc: it.zoneCode || 'A-01',
              openBal, inQty: 0, outQty: l.qty, endBal, party: cust, ref: saleDraft.invNo, date: today
            });
          }

          state.salesLedger.push({
            id: Date.now() + idx + 100, invNo: saleDraft.invNo, branchDoc: bDoc, customer: cust,
            itemId: it.id, itemName: it.name, qty: l.qty, unit: getUnitLabel(it), unitPrice: l.price,
            vatAmt: lineVat, total: lineTot, cost: it.landedCost, profit: lineProf,
            payments: idx === 0 ? cleanPays : [], branch: l.branch, status: 'valid', date: today
          });
          notifItems.push({ name: it.name, qty: l.qty, unit: getUnitLabel(it), loc: it.zoneCode || '-', total: lineTot });
        });

        if (creditAmt > 0) {
          state.creditLedger.push({
            id: Date.now() + 500, docNo: saleDraft.invNo, party: cust, type: 'receivable',
            items: notifItems.map((x) => x.name).join(' · '), total: tot.grand,
            paid: tot.grand - creditAmt, dueDate: saleDraft.dueDate, status: 'open', approvedAmt: 0, approvedBank: '', ftRef: ''
          });
        }

        if (!navigator.onLine) {
          pushQueue({ label: saleDraft.invNo, type: 'SALE', date: today });
        }

        dispatchNotifications('sale', {
          docNo: saleDraft.invNo, branchDoc: bDoc, party: cust, branch: firstBr,
          items: notifItems, total: tot.grand, profit: totalProf
        });

        saveState();
        closeModal();
        vib([25, 20, 40]);
        playTone(680, 0.1, 'triangle');
        renderAll();
        showToast(navigator.onLine ? t('savedOk') : t('offlineQueued'));
      });
    }

    function toggleSaleVoid(saleId) {
      verifyPin(false, () => {
        const s = state.salesLedger.find((x) => x.id === saleId);
        if (!s) return;
        const makeVoid = s.status === 'valid';
        s.status = makeVoid ? 'void' : 'valid';
        state.warehouseLedger.forEach((w) => {
          if (w.ref === s.invNo && w.itemId === s.itemId) w.status = s.status;
        });
        recalcWhItemChain(s.branch, s.itemId);
        saveState();
        renderAll();
        showToast(t('savedOk'));
      });
    }

    // --- የግዢ ቅጽ ሞዳል (ከራስ-ሰር Landed Cost እና Split Payment ጋር) ---
    function openPurchaseModal() {
      const defItem = state.inventory[0];
      const defBr = state.branchScope !== 'all' ? state.branchScope : (state.branches[0]?.name || '');
      const defBank = state.banks[0]?.name || t('creditMethod');
      purDraft = {
        purNo: 'PUR-' + (2000 + state.purchasesLedger.length + 1),
        supplier: state.suppliers[0]?.name || '',
        branch: defBr,
        freight: 0,
        labor: 0,
        dueDate: new Date(Date.now() + 15 * 86400000).toISOString().slice(0, 10),
        lines: defItem ? [{ itemId: defItem.id, qty: 10, unitCost: defItem.landedCost || 100, sellPrice: defItem.sellPrice || 120 }] : [],
        payments: [{ method: defBank, amount: defItem ? 10 * (defItem.landedCost || 100) : 0 }]
      };
      renderPurModal();
    }

    function calcPurTotals() {
      const qtySum = (purDraft?.lines || []).reduce((a, l) => a + Number(l.qty || 0), 0);
      const sub = (purDraft?.lines || []).reduce((a, l) => a + Number(l.qty || 0) * Number(l.unitCost || 0), 0);
      const extra = Number(purDraft?.freight || 0) + Number(purDraft?.labor || 0);
      const grand = sub + extra;
      const extraPer = qtySum > 0 ? extra / qtySum : 0;
      const paid = (purDraft?.payments || []).reduce((a, p) => a + Number(p.amount || 0), 0);
      return { qtySum, sub, extra, grand, extraPer, paid, rem: grand - paid };
    }

    async function submitPurchaseDraft(btn) {
      const tot = calcPurTotals();
      if (tot.grand <= 0) return;
      if (Math.abs(tot.rem) > 1) { showToast(t('errSplit'), true); return; }

      await withBusy(btn, async () => {
        const today = new Date().toISOString().slice(0, 10);
        const bDoc = nextBranchDoc(purDraft.branch);
        const sup = purDraft.supplier.trim() || '-';
        const cleanPays = purDraft.payments.filter((p) => p.amount > 0);
        const creditAmt = cleanPays.filter((p) => p.method === t('creditMethod')).reduce((a, p) => a + p.amount, 0);
        const notifItems = [];

        purDraft.lines.forEach((l, idx) => {
          const it = state.inventory.find((x) => x.id === l.itemId);
          if (!it) return;
          const landed = Math.round(Number(l.unitCost || 0) + tot.extraPer);
          const lineTot = Math.round(l.qty * landed);
          state.purchasesLedger.push({
            id: Date.now() + idx, purNo: purDraft.purNo, branchDoc: bDoc, supplier: sup,
            itemId: it.id, itemName: it.name, qty: l.qty, unit: getUnitLabel(it),
            unitCost: l.unitCost, freight: idx === 0 ? purDraft.freight : 0, labor: idx === 0 ? purDraft.labor : 0,
            landedUnit: landed, sellPrice: l.sellPrice, total: lineTot,
            payments: idx === 0 ? cleanPays : [], branch: purDraft.branch, status: 'pending', date: today
          });
          notifItems.push({ name: it.name, qty: l.qty, unit: getUnitLabel(it), loc: it.zoneCode || '-', total: lineTot });
        });

        if (creditAmt > 0) {
          state.creditLedger.push({
            id: Date.now() + 300, docNo: purDraft.purNo, party: sup, type: 'payable',
            items: notifItems.map((x) => x.name).join(' · '), total: tot.grand,
            paid: tot.grand - creditAmt, dueDate: purDraft.dueDate, status: 'open', approvedAmt: 0, approvedBank: '', ftRef: ''
          });
        }

        dispatchNotifications('purchase', {
          docNo: purDraft.purNo, branchDoc: bDoc, party: sup, branch: purDraft.branch,
          items: notifItems, total: tot.grand, profit: null
        });

        saveState();
        closeModal();
        renderAll();
        showToast(t('savedOk'));
      });
    }

    function receivePendingPurchase(purId) {
      const p = state.purchasesLedger.find((x) => x.id === purId);
      if (!p || p.status !== 'pending') return;
      const it = state.inventory.find((x) => x.id === p.itemId);
      if (!it) return;
      const openBal = getItemStock(it, p.branch);
      const endBal = openBal + Number(p.qty || 0);
      it.branchStock[p.branch] = endBal;
      if (p.landedUnit > 0) it.landedCost = p.landedUnit;
      if (p.sellPrice > 0) it.sellPrice = p.sellPrice;
      p.status = 'received';

      state.warehouseLedger.push({
        id: Date.now(), docNo: p.branchDoc, type: 'IN', status: 'valid', branch: p.branch,
        itemId: it.id, itemName: it.name, unit: p.unit, loc: it.zoneCode || 'A-01',
        openBal, inQty: p.qty, outQty: 0, endBal, party: p.supplier, ref: p.purNo, date: new Date().toISOString().slice(0, 10)
      });

      dispatchNotifications('receive', {
        docNo: p.purNo, branchDoc: p.branchDoc, party: p.supplier, branch: p.branch,
        items: [{ name: it.name, qty: p.qty, unit: p.unit, loc: it.zoneCode || '-', total: p.total }],
        total: p.total, profit: null
      });

      saveState();
      vib([25, 20, 40]);
      renderAll();
      showToast(t('savedOk'));
    }

      });

    function openCreditActionModal(id, mode) {
      const c = state.creditLedger.find((x) => x.id === id);
      if (!c) return;
      const rem = Math.max(0, c.total - c.paid);
      const bankOpts = state.banks.map((b) => `<option value="${esc(b.name)}" ${c.approvedBank === b.name ? 'selected' : ''}>${esc(b.name)}</option>`).join('');
      const title = mode === 'approve' ? t('approvePay') : (mode === 'pay' ? t('executePay') : t('collectPay'));
      const defAmt = mode === 'pay' && c.approvedAmt > 0 ? Math.min(rem, c.approvedAmt) : rem;

      openModal(title, `
        <div class="sub-card">
          <b>${esc(c.party)} (${esc(c.docNo)})</b>
          <div>${esc(t('remainingAmt'))}: <b>${fmtMoney(rem)}</b></div>
        </div>
        <div><label class="lbl">${esc(t('total'))}</label><input id="caAmt" type="number" max="${rem}" min="1" class="inp mono" value="${defAmt}" ${mode === 'pay' ? 'readonly' : ''}></div>
        <div><label class="lbl">${esc(t('bankCol'))}</label><select id="caBank" class="sel" ${mode === 'pay' ? 'disabled' : ''}>${bankOpts}</select></div>
        ${mode === 'pay' ? `<div><label class="lbl">${esc(t('refNo'))}</label><input id="caRef" class="inp mono"></div>` : ''}`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn teal" onclick="runCreditAction(${id},'${mode}')">${esc(t('confirm'))}</button>`);
    }

    function runCreditAction(id, mode) {
      const c = state.creditLedger.find((x) => x.id === id);
      if (!c) return;
      const rem = Math.max(0, c.total - c.paid);
      const amt = Math.min(rem, Math.max(0, Number(document.getElementById('caAmt').value || 0)));
      const bank = document.getElementById('caBank').value;
      if (amt <= 0) return;

      if (mode === 'approve') {
        c.status = 'approved'; c.approvedAmt = amt; c.approvedBank = bank;
      } else if (mode === 'pay') {
        c.paid += amt;
        c.ftRef = document.getElementById('caRef')?.value.trim() || '';
        c.status = c.paid >= c.total ? 'settled' : 'open';
        state.expensesLedger.push({ id: Date.now(), title: `${c.party} (${c.docNo})`, amount: amt, bank: c.approvedBank || bank, date: new Date().toISOString().slice(0, 10) });
      } else {
        c.paid += amt;
        c.status = c.paid >= c.total ? 'settled' : 'open';
        state.salesLedger.push({
          id: Date.now(), invNo: `${c.docNo}-PAY`, branchDoc: c.docNo, customer: c.party,
          itemId: 0, itemName: t('collectPay'), qty: 1, unit: '-', unitPrice: amt, vatAmt: 0,
          total: amt, cost: amt, profit: 0, payments: [{ method: bank, amount: amt }],
          branch: state.branches[0]?.name || '-', status: 'valid', date: new Date().toISOString().slice(0, 10)
        });
      }
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function remindCreditParty(id) {

      if (!c) return;
      const rem = Math.max(0, c.total - c.paid);
      dispatchNotifications('remind', {
        docNo: c.docNo, branchDoc: c.docNo, party: c.party, branch: '-',
        items: [{ name: c.items || t('sCredit'), qty: 1, unit: '', loc: '', total: rem }],
        total: rem, profit: null
      });
      saveState();
      showToast(t('savedOk'));
    }

    // === የክፍል 2 መጨረሻ (ክፍል 3 ከዚህ ቀጥሎ ይገባል) ===
    // =========================================================================
    // ክፍል 3: መጋዘን (ክምችት፣ ፈጣን መመዝገቢያ፣ ዕለታዊ፣ ካርታ፣ ማስጠንቀቂያ)፣
    //         ዘመናዊ ቆጠራ ሞተር እና ማጓጓዣ
    // =========================================================================

    function L(am, en) { return state.lang === 'en' ? en : am; }

    let entryDragEl = null;
    let entryDragIdx = -1;
    let activeBinModalSlots = [];

    // -------------------------------------------------------------------------
    // 5. መጋዘን (ክምችት፣ ፈጣን መመዝገቢያ፣ ዕለታዊ፣ ካርታ እና ማስጠንቀቂያ)
    // -------------------------------------------------------------------------
    function renderWarehouse(sub) {
      const root = document.getElementById('viewRoot');
      const br = state.branchScope;
      const q = (document.getElementById('globalSearch')?.value || '').trim().toLowerCase();

      if (sub === 'stock') {
        const pend = state.purchasesLedger.filter((p) => p.status === 'pending' && (br === 'all' || p.branch === br));
        root.innerHTML = '';
        if (pend.length) {
          const pendBox = document.createElement('div');
          pendBox.className = 'card';
          pendBox.style.borderColor = 'rgba(245,158,11,0.5)';
          pendBox.innerHTML = `
            <div class="card-row">
              <b style="color:var(--amber);">📥 ${esc(t('pendingInbound'))} (${pend.length})</b>
            </div>
            ${pend.map((p) => `
              <div class="sub-card" style="flex-direction:row;justify-content:space-between;align-items:center;gap:8px;">
                <div style="min-width:0;">
                  <b>${esc(p.itemName)}</b>
                  <div style="font-size:10.5px;color:var(--muted);">${esc(p.branchDoc)} · ${esc(p.supplier)} · ${fmtNum(p.qty)} ${esc(p.unit)} · ${esc(p.branch)}</div>
                </div>
                <button type="button" class="btn emerald sm" onclick="receivePendingPurchase(${p.id})">${esc(t('receiveNow'))}</button>
              </div>`).join('')}`;
          root.appendChild(pendBox);
        }
        const tblBox = document.createElement('div');
        tblBox.style.cssText = 'display:flex;flex-direction:column;gap:9px;';
        root.appendChild(tblBox);
        renderStockReportTable(tblBox);
        return;
      }

      if (sub === 'entry') {
        renderFastEntry(root);
        return;
      }

      if (sub === 'ledger') {
        renderDailyLedger(root, q, br);
        return;
      }

      if (sub === 'map') {
        renderWarehouseMap(root, q, br);
        return;
      }

      // ማስጠንቀቂያዎች (ያለቁ፣ ዝቅተኛ ክምችት እና የማብቂያ ቀን)
      const activeBrObj = state.branches.find((b) => b.name === br) || state.branches[0];
      const critLim = Number(activeBrObj?.criticalLimit ?? 5);
      const lowLim = Number(activeBrObj?.lowLimit ?? 20);
      const weekStart = getWeekStartDateStr();
      const movedThisWeek = new Set(
        state.warehouseLedger
          .filter((r) => r.status === 'valid' && r.date >= weekStart && (br === 'all' || r.branch === br))
          .map((r) => r.itemId)
      );
      const soonDate = new Date(Date.now() + 60 * 86400000).toISOString().slice(0, 10);

      const outList = [];
      const lowList = [];
      const expList = [];

      state.inventory.forEach((it) => {
        const qty = getItemStock(it, br);
        if (qty <= 0) {
          outList.push({ ...it, qty, isNewZero: movedThisWeek.has(it.id) });
        } else if (qty <= lowLim) {
          lowList.push({ ...it, qty, isCrit: qty <= critLim });
        }
        if (state.cfg.expiry && it.expiry && it.expiry <= soonDate && qty > 0) {
          expList.push({ ...it, qty });
        }
      });

      root.innerHTML = `
        <div class="card-row">
          <div style="display:flex;gap:6px;flex-wrap:wrap;">
            <span class="pill rose">${esc(t('outOfStock'))}: ${outList.length}</span>
            <span class="pill amber">${esc(t('lowStock'))}: ${lowList.length}</span>
            ${state.cfg.expiry ? `<span class="pill">${esc(t('expiringSoon'))}: ${expList.length}</span>` : ''}
          </div>
          <button type="button" class="btn amber sm" onclick="sendRiskAuditReport()">⚠️ ${esc(t('sendRiskAudit'))}</button>
        </div>
        ${!outList.length && !lowList.length && !expList.length ? `<div class="card" style="text-align:center;color:var(--emerald);padding:20px;">✅ ${esc(t('allHealthy'))}</div>` : ''}
        ${outList.length ? `
          <div class="card" style="border-color:rgba(239,68,68,0.45);">
            <b style="color:var(--rose);">🔴 ${esc(t('outOfStock'))} (${outList.length})</b>
            <div class="cards-grid">
              ${outList.map((i) => `
                <div class="sub-card">
                  <div class="card-row">
                    <b>${esc(i.name)}</b>
                    <span class="pill rose">${i.isNewZero ? esc(t('thisWeek')) : '0'}</span>
                  </div>
                  <div style="font-size:10.5px;color:var(--muted);">${esc(formatLoc(i))}</div>
                </div>`).join('')}
            </div>
          </div>` : ''}
        ${lowList.length ? `
          <div class="card" style="border-color:rgba(245,158,11,0.45);">
            <b style="color:var(--amber);">🟠 ${esc(t('lowStock'))} (${lowList.length})</b>
            <div class="cards-grid">
              ${lowList.sort((a, b) => a.qty - b.qty).map((i) => `
                <div class="sub-card">
                  <div class="card-row">
                    <b>${esc(i.name)}</b>
                    <span class="pill ${i.isCrit ? 'rose' : 'amber'}">${fmtNum(i.qty)} ${esc(getUnitLabel(i))}</span>
                  </div>
                  <div style="font-size:10.5px;color:var(--muted);">${esc(formatLoc(i))}</div>
                </div>`).join('')}
            </div>
          </div>` : ''}
        ${expList.length ? `
          <div class="card">
            <b style="color:var(--primary);">⏳ ${esc(t('expiringSoon'))} (${expList.length})</b>
            ${expList.map((i) => `
              <div class="sub-card" style="flex-direction:row;justify-content:space-between;align-items:center;">
                <b>${esc(i.name)}</b>
                <span class="pill rose">${esc(i.expiry)} · ${fmtNum(i.qty)} ${esc(getUnitLabel(i))}</span>
              </div>`).join('')}
          </div>` : ''}`;
    }

    // --- 5.1 ፈጣን የመጋዘን መመዝገቢያ (ካርዶች + ጎትቶ መደርደሪያ ቅርጫት + ወደ ቆጠራ) ---
    function getEntryBranch() {
      return state.branchScope !== 'all' ? state.branchScope : (state.branches[0]?.name || '');
    }

    function getSuggestedEntryDocNo(brName) {
      const b = state.branches.find((x) => x.name === brName) || state.branches[0];
      if (!b) return 'DOC-0001';

      const sInp = document.getElementById('entryQuickSearch');
      const qInp = document.getElementById('entryQuickQty');
      const rawName = formatSmartDim((sInp?.value || '').trim());
      const qty = Math.floor(Number(qInp?.value || 0));
      if (!rawName || qty <= 0) return;

      const low = rawName.toLowerCase();

    function quickRegisterAndAdd(name, qty) {
      const it = {
        id: Date.now(), sku: 'KS-' + Math.floor(100 + Math.random() * 900), name,
        category: t('allCategories'), unitIdx: 0, subUnitIdx: 0, packSize: 1, styleIdx: 1,
        zoneCode: 'A-01', landedCost: 0, floorPrice: 0, sellPrice: 0, expiry: '', serial: '', variant: '', branchStock: {}
      };
      state.inventory.push(it);
      saveState();
      closeModal();
      pushToEntryBasket(it, qty);
      renderView();
      showToast(t('savedOk'));

    function pushToEntryBasket(it, qty) {
      const ex = entryBasket.find((x) => x.itemId === it.id);
      if (ex) ex.qty += qty;
      else entryBasket.push({ itemId: it.id, name: it.name, unit: getUnitLabel(it), loc: it.zoneCode || 'A-01', qty });
      vib(20);
    }

    function startEntryBasketDrag(rowEl, e) {
      if (entryBasket.length <= 1) return;
      e.preventDefault();
      const list = document.getElementById('entryBasketList');
      entryDragEl = rowEl;
      entryDragIdx = Array.from(list.children).indexOf(rowEl);
      rowEl.classList.add('dragging');
      vib(25);

      const onMove = (ev) => {
        if (!entryDragEl) return;
        const rows = Array.from(list.children);
        for (let i = 0; i < rows.length; i++) {
          const r = rows[i].getBoundingClientRect();
          if (ev.clientY >= r.top && ev.clientY <= r.bottom && i !== entryDragIdx) {
            const moved = entryBasket.splice(entryDragIdx, 1)[0];
            entryBasket.splice(i, 0, moved);
            list.insertBefore(entryDragEl, i < entryDragIdx ? rows[i] : rows[i].nextSibling);
            entryDragIdx = i;
            vib(12);
            Array.from(list.children).forEach((el, k) => { el.querySelector('.drag-handle').textContent = k + 1; });
            break;
          }
        }
      };
      const onUp = () => {
        if (entryDragEl) entryDragEl.classList.remove('dragging');
        entryDragEl = null; entryDragIdx = -1;
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    }

    function readEntryHeader() {
      const docNo = (document.getElementById('entDocNo')?.value || '').trim();
      const party = (document.getElementById('entParty')?.value || '').trim() || '-';
      const parts = [];
      const ref = (document.getElementById('entRef')?.value || '').trim();
      const drv = (document.getElementById('entDriver')?.value || '').trim();
      const plt = (document.getElementById('entPlate')?.value || '').trim();
      const kg = (document.getElementById('entKg')?.value || '').trim();
      const note = (document.getElementById('entNote')?.value || '').trim();
      if (ref) parts.push(ref);
      if (drv || plt) parts.push(`${drv || '-'} / ${plt || '-'}`);
      if (kg) parts.push(`${kg} ${L('ኪ.ግ', 'kg')}`);
      if (note) parts.push(note);
      return { docNo, party, ref: parts.join(' | ') || '-' };
    }

    function sendEntryBasketToTally() {
      if (!entryBasket.length) return;

        id, dir: entryMode, docNo: hdr.docNo || nextBranchDoc(br), party: hdr.party, branch: br,
        activeItemId: entryBasket[0].itemId,
        items: entryBasket.map((b) => ({ itemId: b.itemId, name: b.name, unit: b.unit, loc: b.loc, target: b.qty, strokes: [] }))

      entryBasket = [];
      saveState();
      vib([25, 20, 30]);
      switchMainTab('tally');
      switchSubTab('tickets');
      showToast(t('savedOk'));

    function promptDirectEntryVoid() {
      const docNo = (document.getElementById('entDocNo')?.value || '').trim();
      if (!docNo) { showToast(t('errNeedDoc'), true); return; }
      openModal(t('voidWord'), `<div class="sub-card" style="text-align:center;"><b>${esc(docNo)} ➔ ${esc(t('voidWord'))}</b></div>`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn danger" onclick="commitDirectVoidDoc('${esc(docNo)}')">${esc(t('voidWord'))}</button>`);

    function commitDirectVoidDoc(docNo) {
      const br = getEntryBranch();
      const bObj = state.branches.find((b) => b.name === br);
      if (bObj) bObj.seq = Math.max(Number(bObj.seq || 0), docNumInt(docNo));
      state.warehouseLedger.push({
        id: Date.now(), docNo, type: 'OUT', status: 'void', branch: br,
        itemId: 0, itemName: t('voidWord'), unit: '-', loc: '-',
        openBal: 0, inQty: 0, outQty: 0, endBal: 0, party: t('voidWord'), ref: '-', date: new Date().toISOString().slice(0, 10)
      });
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function commitEntryBasket(btn) {
      if (!entryBasket.length) return;
      const hdr = readEntryHeader();
      const br = getEntryBranch();
      if (entryMode === 'OUT' && !hdr.docNo) { showToast(t('errNeedDoc'), true); return; }

      const isDup = entryMode === 'OUT' && state.warehouseLedger.some((r) => r.branch === br && r.docNo.toLowerCase() === hdr.docNo.toLowerCase());
      if (isDup) {
        openModal(t('dupTitle'), `<div class="sub-card">${esc(t('dupMsg'))}</div>`, `
          <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
          <button type="button" class="btn teal" onclick="closeModal();verifyPin(true,()=>executeWarehouseMovement(entryMode,readEntryHeader(),getEntryBranch(),entryBasket,()=>{entryBasket=[];}))">${esc(t('confirm'))}</button>`);
        return;
      }

      withBusy(btn, async () => {
        executeWarehouseMovement(entryMode, hdr, br, entryBasket, () => { entryBasket = []; });
      });
    }

    function executeWarehouseMovement(dir, hdr, branch, lines, onDone) {
      if (dir === 'OUT') {
        for (const l of lines) {
          const it = state.inventory.find((x) => x.id === l.itemId);
          if (!it || getItemStock(it, branch) < l.qty) { showToast(t('errStock'), true); return false; }
        }
      }
      const docNo = hdr.docNo || nextBranchDoc(branch);
      const bObj = state.branches.find((b) => b.name === branch);
      if (bObj) bObj.seq = Math.max(Number(bObj.seq || 0), docNumInt(docNo));
      const today = new Date().toISOString().slice(0, 10);
      const notifItems = [];

      lines.forEach((l, idx) => {
        const it = state.inventory.find((x) => x.id === l.itemId);
        if (!it) return;
        const openBal = getItemStock(it, branch);
        const endBal = dir === 'IN' ? openBal + l.qty : openBal - l.qty;
        it.branchStock[branch] = endBal;
        state.warehouseLedger.push({
          id: Date.now() + idx, docNo, type: dir, status: 'valid', branch,
          itemId: it.id, itemName: it.name, unit: getUnitLabel(it), loc: it.zoneCode || 'A-01',
          openBal, inQty: dir === 'IN' ? l.qty : 0, outQty: dir === 'OUT' ? l.qty : 0, endBal,
          party: hdr.party || '-', ref: hdr.ref || '-', date: today
        });
        notifItems.push({ name: it.name, qty: l.qty, unit: getUnitLabel(it), loc: it.zoneCode || '-', total: null });
      });

      if (!navigator.onLine) pushQueue({ label: docNo, type: dir, date: today });

      dispatchNotifications(dir === 'IN' ? 'receive' : 'dispatch', {
        docNo, branchDoc: docNo, party: hdr.party || '-', branch,
        items: notifItems, total: null, profit: null
      });

      if (onDone) onDone();
      saveState();
      vib([30, 20, 40]);
      playTone(660, 0.09, 'triangle');
      renderAll();
      showToast(navigator.onLine ? t('savedOk') : t('offlineQueued'));
      return true;
    }

    // --- 5.2 ዕለታዊ የመጋዘን ሌጀር (በሰነድ ወይም በጊዜ ደርድር፣ ዜሮ ማጣሪያ፣ እርማት/ሰረዛ/ሙሉ ስረዛ) ---
    function getSortedLedgerRows(rows) {
      const groups = [], map = new Map();
      rows.forEach((r) => {
        const key = `${r.branch}|${r.docNo}`;
        if (!map.has(key)) {
          const g = { docNum: docNumInt(r.docNo), docStr: r.docNo, maxId: r.id, lines: [] };
          map.set(key, g); groups.push(g);
        }
        const g = map.get(key);
        g.lines.push(r);
        g.maxId = Math.max(g.maxId, r.id);
      });
      if (dailySort === 'TIME') groups.sort((a, b) => b.maxId - a.maxId);
      else groups.sort((a, b) => a.docNum - b.docNum || a.docStr.localeCompare(b.docStr));
      const out = [];
      groups.forEach((g) => g.lines.forEach((l) => out.push(l)));
      return out;
    }

    function renderDailyLedger(root, q, br) {
      const raw = state.warehouseLedger.filter((r) => {
        if (br !== 'all' && r.branch !== br) return false;
        if (zeroOnlyFilter && r.endBal !== 0) return false;
        if (q && !`${r.docNo} ${r.itemName} ${r.party} ${r.ref} ${r.date}`.toLowerCase().includes(q)) return false;
        return true;
      });
      const ordered = getSortedLedgerRows(raw);
      const showAct = Boolean(state.cfg.showActions && hasPerm('editVoid'));
      let inT = 0, outT = 0, vCnt = 0, lastKey = '';

      const trs = ordered.map((r) => {
        const key = `${r.branch}|${r.docNo}`;
        const sp = !q && lastKey && lastKey !== key ? `<tr class="r-sp"><td colspan="${showAct ? 9 : 8}"></td></tr>` : '';
        const same = !q && lastKey === key;
        lastKey = key;
        const isV = r.status === 'void';
        if (isV) vCnt++; else { inT += Number(r.inQty || 0); outT += Number(r.outQty || 0); }
        const isSel = pdfSelectScope === 'daily' && Boolean(pdfSelected[String(r.id)]);
        const cls = isSel ? 'r-sel' : (isV ? 'r-void' : (r.type === 'IN' ? 'r-in' : (r.type === 'ADJ' ? 'r-adj' : (r.endBal === 0 ? 'r-zero' : ''))));

        return `${sp}
          <tr class="${cls}" onclick="togglePdfRow('daily','${r.id}',this)">
            <td style="font-family:ui-monospace,monospace;"><b>${esc(same ? '↳' : r.docNo)}</b></td>
