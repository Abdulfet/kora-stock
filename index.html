            <td class="ctr" style="color:var(--rose);">${!isV && r.outQty ? '-' + fmtNum(r.outQty) : '-'}</td>
            <td class="ctr"><b>${isV ? '-' : fmtNum(r.endBal)}</b></td>
            <td>${esc(same ? '↳' : r.party)}</td>
            <td class="ctr">${esc(same ? '↳' : r.date)}</td>
            ${showAct ? `<td class="ctr">${!same ? `<button type="button" class="icon-btn sm" onclick="event.stopPropagation();openEditLedgerModal('${esc(r.docNo)}','${esc(r.branch)}')">⚙️</button>` : ''}</td>` : ''}
          </tr>`;
      }).join('');

      root.innerHTML = `
        <div class="card-row">
          <div style="display:flex;gap:5px;flex-wrap:wrap;">
            <button type="button" class="icon-btn sm" onclick="dailySort=dailySort==='DOC'?'TIME':'DOC';vib(14);showToast(dailySort==='DOC'?t('sortDoc'):t('sortTime'));renderView();">${dailySort === 'DOC' ? '#' : '🕒'}</button>
            <button type="button" class="icon-btn sm ${zeroOnlyFilter ? 'on' : ''}" style="color:var(--amber);" onclick="zeroOnlyFilter=!zeroOnlyFilter;vib(14);renderView();">0</button>
            ${hasPerm('editVoid') ? `<button type="button" class="icon-btn sm ${state.cfg.showActions ? 'on' : ''}" onclick="state.cfg.showActions=!state.cfg.showActions;saveState();renderView();">⚙️</button>` : ''}
            <button type="button" class="btn teal sm" onclick="openDailyPdfChoiceModal()">📄 ${esc(t('pdf'))}</button>
          </div>
          <div style="display:flex;gap:6px;font-family:ui-monospace,monospace;font-size:11px;font-weight:900;">
            <span style="color:var(--emerald);">+${fmtNum(inT)}</span>
            <span style="color:var(--rose);">-${fmtNum(outT)}</span>
            <span style="color:var(--amber);">${esc(t('voidWord'))}: ${vCnt}</span>
          </div>
        </div>
        <div class="tbl-wrap">
          <table class="tbl">
            <thead>
              <tr>
                <th>${esc(t('docNo'))}</th>
                <th>${esc(t('item'))}</th>
                <th class="ctr">${esc(t('openingBal'))}</th>
                <th class="ctr">${esc(t('totalIn'))}</th>
                <th class="ctr">${esc(t('totalOut'))}</th>
                <th class="ctr">${esc(t('endingBal'))}</th>
                <th>${esc(t('party'))}</th>
                <th class="ctr">${esc(t('dateCol'))}</th>
                ${showAct ? `<th class="ctr">${esc(t('actionCol'))}</th>` : ''}
              </tr>
            </thead>
            <tbody>${trs || `<tr><td colspan="${showAct ? 9 : 8}" class="ctr" style="padding:18px;color:var(--muted);">${esc(t('noData'))}</td></tr>`}</tbody>
          </table>
        </div>`;
    }

    function openEditLedgerModal(docNo, branch) {
      const lines = state.warehouseLedger.filter((r) => r.docNo === docNo && r.branch === branch);
      if (!lines.length) return;
      const head = lines[0];
      const isVoid = head.status === 'void';

      openModal(`${t('edit')} · ${docNo}`, `
        <div class="sub-card">
          <div class="grid-2">
            <div><label class="lbl">${esc(t('party'))}</label><input id="edLParty" class="inp" value="${esc(head.party)}"></div>
            <div><label class="lbl">${esc(t('refNo'))}</label><input id="edLRef" class="inp" value="${esc(head.ref)}"></div>
          </div>
          ${lines.map((l) => `
            <div style="display:grid;grid-template-columns:1fr 80px;gap:6px;align-items:center;">
              <b style="font-size:11.5px;">${esc(l.itemName)}</b>
              <input type="number" min="1" class="inp sm mono ed-l-qty" data-id="${l.id}" value="${l.inQty || l.outQty || 1}" ${isVoid ? 'disabled' : ''}>
            </div>`).join('')}
        </div>
        <button type="button" class="btn ${isVoid ? 'teal' : 'danger'}" onclick="toggleLedgerDocVoid('${esc(docNo)}','${esc(branch)}',${!isVoid})">${esc(isVoid ? t('unvoidWord') : t('voidWord'))}</button>
        ${isOwner() ? `<button type="button" class="btn hard-del" onclick="hardDeleteLedgerDoc('${esc(docNo)}','${esc(branch)}')">🗑️ ${esc(t('hardDel'))}</button>` : ''}`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn teal" onclick="saveLedgerDocEdits('${esc(docNo)}','${esc(branch)}')">${esc(t('save'))}</button>`);
    }

    function saveLedgerDocEdits(docNo, branch) {
      const newParty = document.getElementById('edLParty').value.trim() || '-';
      const newRef = document.getElementById('edLRef').value.trim() || '-';
      const qtyInputs = Array.from(document.querySelectorAll('.ed-l-qty')).map((el) => ({ id: Number(el.dataset.id), qty: Math.max(1, Number(el.value || 1)) }));
      verifyPin(false, () => {
        const affected = new Set();
        state.warehouseLedger.forEach((r) => {
          if (r.docNo === docNo && r.branch === branch) {
            r.party = newParty; r.ref = newRef;
            const found = qtyInputs.find((x) => x.id === r.id);
            if (found && r.status === 'valid') {
              if (r.type === 'IN') r.inQty = found.qty;
              else if (r.type === 'OUT') r.outQty = found.qty;
              affected.add(r.itemId);
            }
          }
        });
        affected.forEach((iid) => recalcWhItemChain(branch, iid));
        saveState(); renderAll(); showToast(t('savedOk'));
      });
    }

    function toggleLedgerDocVoid(docNo, branch, makeVoid) {
      verifyPin(!makeVoid, () => {
        const affected = new Set();
        state.warehouseLedger.forEach((r) => {
          if (r.docNo === docNo && r.branch === branch) {
            r.status = makeVoid ? 'void' : 'valid';
            if (r.itemId) affected.add(r.itemId);
          }
        });
        affected.forEach((iid) => recalcWhItemChain(branch, iid));
        saveState(); renderAll(); showToast(t('savedOk'));
      });
    }

    function hardDeleteLedgerDoc(docNo, branch) {
      verifyPin(true, () => {
        const affected = new Set();
        state.warehouseLedger.forEach((r) => {
          if (r.docNo === docNo && r.branch === branch && r.itemId) affected.add(r.itemId);
        });
        state.warehouseLedger = state.warehouseLedger.filter((r) => !(r.docNo === docNo && r.branch === branch));
        affected.forEach((iid) => recalcWhItemChain(branch, iid));
        saveState(); renderAll(); showToast(t('savedOk'));
      });
    }

    // --- 5.3 የመጋዘን ካርታ (መደርደሪያዎች፣ ባለብዙ ምርጫ እና ካሜራ ስካነር) ---
    function renderWarehouseMap(root, q, br) {
      const racks = state.racks.filter((r) => br === 'all' || r.branch === br);
      if (!racks.length) {
        root.innerHTML = `<div class="card" style="text-align:center;color:var(--muted);">${esc(t('noData'))}</div>`;
        return;
      }
      if (!racks.some((r) => r.code === activeRackCode)) activeRackCode = racks[0].code;
      const rk = racks.find((r) => r.code === activeRackCode) || racks[0];
      const selCount = Object.keys(bulkMapSlots).length;

      const cells = [];
      for (let i = 1; i <= rk.cols * rk.rows; i++) {
        const sid = `${rk.code}-${i < 10 ? '0' + i : i}`;
        const key = `${rk.branch}|${sid}`;
        const ids = state.binSlots[key] || [];
        const names = ids.map((id) => state.inventory.find((x) => x.id === id)?.name).filter(Boolean);
        const hl = q && (sid.toLowerCase().includes(q) || names.some((n) => n.toLowerCase().includes(q)));
        const cls = bulkMapSlots[key] ? 'sel' : (hl ? 'hl' : (names.length ? 'used' : ''));
        cells.push(`
          <div class="bin ${cls}" onclick="onWarehouseBinClick('${esc(key)}','${esc(sid)}')">
            <span class="bin-id">${esc(sid)}</span>
            <span class="bin-it">${names.length ? esc(names.join('፣ ')) : esc(t('emptyBin'))}</span>
          </div>`);
      }

      root.innerHTML = `
        <div class="card-row">
          <div style="display:flex;gap:5px;overflow-x:auto;flex:1;" class="no-scrollbar">
            ${racks.map((r) => `<button type="button" class="subtab ${r.code === rk.code ? 'active' : ''}" onclick="activeRackCode='${esc(r.code)}';vib(12);renderView();">${esc(r.name)}</button>`).join('')}
          </div>
          <div style="display:flex;gap:5px;">
            <button type="button" class="btn muted sm" onclick="openQrScannerModal()">📷 ${esc(t('scanCode'))}</button>
            <button type="button" class="btn sm ${bulkMapMode ? 'primary' : 'muted'}" onclick="bulkMapMode=!bulkMapMode;bulkMapSlots={};vib(14);renderView();">☑️ ${esc(t('bulkSelect'))}</button>
            ${bulkMapMode && selCount > 0 ? `<button type="button" class="btn emerald sm" onclick="openBinAssignModal(null)">${esc(t('assignBin'))} (${selCount})</button>` : ''}
          </div>
        </div>
        <div class="card" style="overflow:auto;">
          <div class="rack-grid" style="grid-template-columns:repeat(${rk.cols},1fr);">${cells.join('')}</div>
        </div>`;
    }

    function onWarehouseBinClick(slotKey, sid) {
      vib(16);
      if (bulkMapMode) {
        if (bulkMapSlots[slotKey]) delete bulkMapSlots[slotKey];
        else bulkMapSlots[slotKey] = sid;
        renderView();
        return;
      }
      openBinAssignModal(slotKey, sid);
    }

    function openBinAssignModal(singleKey, singleSid = '') {
      activeBinModalSlots = singleKey ? [singleKey] : Object.keys(bulkMapSlots);
      if (!activeBinModalSlots.length) return;
      const curIds = singleKey ? (state.binSlots[singleKey] || []) : [];
      const curItemsHtml = curIds.map((id) => {
        const it = state.inventory.find((x) => x.id === id);
        return it ? `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>• ${esc(it.name)}</span>
            <button type="button" class="icon-btn sm" style="color:var(--rose);" onclick="removeItemFromBin('${esc(singleKey)}',${id})">✕</button>
          </div>` : '';
      }).join('');

      const sorted = state.inventory.slice().sort((a, b) => compareItemsSmart(a.name, b.name, a.category || ''));
      const title = singleSid ? `📍 ${singleSid}` : `📍 ${activeBinModalSlots.length}`;

      openModal(title, `
        ${curItemsHtml ? `<div class="sub-card">${curItemsHtml}</div>` : ''}
        <select id="selBinItem" class="sel">${sorted.map((it) => `<option value="${it.id}">${esc(it.name)}</option>`).join('')}</select>
        <div class="switch-row">
          <span>${esc(t('keepExisting'))}</span>
          <div id="tglBinAppend" class="toggle on" onclick="this.classList.toggle('on')"></div>
        </div>`, `
        ${singleKey ? `<button type="button" class="btn danger" onclick="clearBinSlot('${esc(singleKey)}')">${esc(t('clearBin'))}</button>` : `<button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>`}
        <button type="button" class="btn teal" onclick="saveBinAssignment()">${esc(t('assignBin'))}</button>`);
    }

    function saveBinAssignment() {
      const itemId = Number(document.getElementById('selBinItem')?.value || 0);
      const append = document.getElementById('tglBinAppend')?.classList.contains('on');
      if (!itemId || !activeBinModalSlots.length) return;
      const it = state.inventory.find((x) => x.id === itemId);
      activeBinModalSlots.forEach((key) => {
        const cur = append ? (state.binSlots[key] || []).slice() : [];
        if (!cur.includes(itemId)) cur.push(itemId);
        state.binSlots[key] = cur;
        if (it) it.zoneCode = key.split('|')[1] || it.zoneCode;
      });
      if (bulkMapMode) { bulkMapMode = false; bulkMapSlots = {}; }
      saveState(); closeModal(); renderView(); showToast(t('savedOk'));
    }

    function removeItemFromBin(slotKey, itemId) {
      state.binSlots[slotKey] = (state.binSlots[slotKey] || []).filter((x) => x !== itemId);
      saveState(); closeModal(); renderView();
    }

    function clearBinSlot(slotKey) {
      delete state.binSlots[slotKey];
      saveState(); closeModal(); renderView(); showToast(t('savedOk'));
    }

    async function openQrScannerModal() {
      openModal(t('scanCode'), `
        <video id="qrVideo" class="qr-video" autoplay playsinline muted></video>
        <input id="inpQrCode" class="inp mono" style="text-transform:uppercase;" placeholder="${esc(t('zoneCode'))}" onkeydown="if(event.key==='Enter') jumpToBinCode(this.value)">`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('close'))}</button>
        <button type="button" class="btn teal" onclick="jumpToBinCode(document.getElementById('inpQrCode').value)">${esc(t('confirm'))}</button>`);
      try {
        qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        const vid = document.getElementById('qrVideo');
        if (vid) vid.srcObject = qrStream;
        if ('BarcodeDetector' in window) {
          const det = new BarcodeDetector({ formats: ['qr_code', 'code_128'] });
          const loop = async () => {
            if (!qrStream) return;
            try {
              const codes = await det.detect(vid);
              if (codes.length && codes[0].rawValue) { jumpToBinCode(codes[0].rawValue); return; }
            } catch {}
            qrLoop = requestAnimationFrame(loop);
          };
          qrLoop = requestAnimationFrame(loop);
        }
      } catch {}
    }

    function jumpToBinCode(raw) {
      const code = String(raw || '').trim().toUpperCase();
      if (!code) return;
      closeModal();
      const rkCode = code.split('-')[0];
      const rk = state.racks.find((r) => r.code === rkCode) || state.racks[0];
      if (rk) {
        activeRackCode = rk.code;
        renderView();
        openBinAssignModal(`${rk.branch}|${code}`, code);
      }
    }

    // -------------------------------------------------------------------------
    // 6. ዘመናዊ ቆጠራ ሞተር (v12 Swipe-Gate / Ping-Pong / Tap / Multi-Carrier + 10-Dot / 5-Tally)
    // -------------------------------------------------------------------------
    function ensureTallyTicket() {
      if (!state.tally.tickets.length) {
        const br = getEntryBranch();
        const id = 'tk_' + Date.now();
        state.tally.tickets.push({ id, dir: 'OUT', docNo: getSuggestedEntryDocNo(br), party: '', branch: br, activeItemId: 0, items: [] });
        state.tally.activeTicketId = id;
      } else if (!state.tally.tickets.some((x) => x.id === state.tally.activeTicketId)) {
        state.tally.activeTicketId = state.tally.tickets[0].id;
      }
    }

    function getActiveTicket() {
      ensureTallyTicket();
      return state.tally.tickets.find((x) => x.id === state.tally.activeTicketId) || state.tally.tickets[0];
    }

    function getActiveTicketItem() {
      const tk = getActiveTicket();
      if (!tk || !tk.items.length) return null;
      let it = tk.items.find((x) => x.itemId === tk.activeItemId);
      if (!it) { it = tk.items[0]; tk.activeItemId = it.itemId; }
      return it;
    }

    function jumpItemToTally(itemId) {
      const it = state.inventory.find((x) => x.id === itemId);
      if (!it) return;
      const tk = getActiveTicket();
      if (!tk.items.some((x) => x.itemId === itemId)) {
        tk.items.push({ itemId: it.id, name: it.name, unit: getUnitLabel(it), loc: it.zoneCode || 'A-01', target: 0, strokes: [] });
      }
      tk.activeItemId = itemId;
      saveState();
      switchMainTab('tally');
      switchSubTab('tickets');
    }

    function getTallyContext() {
      const sub = state.activeSubTab.tally || 'tickets';
      if (sub === 'free') {
        return { sub, strokes: state.tally.free.strokes, target: Number(state.tally.free.target || 0), hardStop: Boolean(state.tally.free.lockTarget), isAudit: false, dir: 'FREE', enabled: true };
      }
      if (sub === 'audit') {
        const it = state.inventory.find((x) => x.id === Number(state.tally.audit.itemId)) || state.inventory[0];
        if (it) state.tally.audit.itemId = it.id;
        return { sub, strokes: state.tally.audit.strokes, target: it ? getItemStock(it, getEntryBranch()) : 0, hardStop: false, isAudit: true, dir: 'AUDIT', enabled: Boolean(it), auditItem: it };
      }
      const tk = getActiveTicket();
      const tkIt = getActiveTicketItem();
      if (!tkIt) return { sub, strokes: [], target: 0, hardStop: false, isAudit: false, dir: tk.dir, enabled: false };
      return { sub, strokes: tkIt.strokes, target: Number(tkIt.target || 0), hardStop: tk.dir === 'OUT', isAudit: false, dir: tk.dir, enabled: true };
    }

    function sumStrokes(arr) { return (arr || []).reduce((s, x) => s + Number(x.qty || 0), 0); }

    function renderTally(sub) {
      const root = document.getElementById('viewRoot');
      if (sub === 'history') {
        root.innerHTML = `
          <div class="cards-grid">
            ${(state.tally.logs || []).slice().reverse().map((l) => `
              <div class="card" style="flex-direction:row;justify-content:space-between;align-items:center;">
                <div>
                  <b>${esc(l.item)}</b>
                  <div style="font-size:10.5px;color:var(--muted);">${esc(l.time)}</div>
                </div>
                <div style="display:flex;align-items:center;gap:8px;">
                  <span class="pill teal" style="font-size:13px;">${fmtNum(l.qty)}</span>
                  <button type="button" class="icon-btn sm" style="color:var(--rose);" onclick="state.tally.logs=state.tally.logs.filter(x=>x.id!==${l.id});saveState();renderView();">✕</button>
                </div>
              </div>`).join('') || `<div class="card" style="text-align:center;color:var(--muted);">${esc(t('noData'))}</div>`}
          </div>`;
        return;
      }

      let topSection = '';
      if (sub === 'tickets') {
        const tk = getActiveTicket();
        topSection = `
          <div style="display:flex;gap:5px;overflow-x:auto;" class="no-scrollbar">
            ${state.tally.tickets.map((x, i) => `
              <button type="button" class="subtab ${x.id === tk.id ? 'active' : ''}" onclick="state.tally.activeTicketId='${x.id}';saveState();renderView();">🚛 ${esc(x.docNo || (t('sTickets') + ' ' + (i + 1)))}</button>`).join('')}
            <button type="button" class="subtab" style="border-style:dashed;color:var(--teal);border-color:var(--teal);" onclick="addNewTallyTicket()">+ ${esc(t('newTicket'))}</button>
          </div>
          <div class="card" style="padding:7px;">
            <div style="display:grid;grid-template-columns:auto 1fr 1fr auto;gap:5px;align-items:center;">
              <button type="button" class="btn sm ${tk.dir === 'OUT' ? 'danger' : 'emerald'}" onclick="getActiveTicket().dir=getActiveTicket().dir==='OUT'?'IN':'OUT';saveState();renderView();">${esc(tk.dir === 'OUT' ? t('modeOut') : t('modeIn'))}</button>
              <input class="inp sm mono" value="${esc(tk.docNo)}" placeholder="${esc(t('docNo'))}" oninput="getActiveTicket().docNo=this.value;saveState();">
              <input class="inp sm" value="${esc(tk.party)}" placeholder="${esc(t('party'))}" oninput="getActiveTicket().party=this.value;saveState();">
              <button type="button" class="icon-btn sm" style="color:var(--rose);" onclick="deleteActiveTallyTicket()">✕</button>
            </div>
            <div style="display:flex;gap:5px;overflow-x:auto;" class="no-scrollbar">
              ${tk.items.map((x) => {
                const cnt = sumStrokes(x.strokes);

                return `<button type="button" class="btn sm ${x.itemId === tk.activeItemId ? 'teal' : (done ? 'emerald' : 'muted')}" onclick="getActiveTicket().activeItemId=${x.itemId};saveState();renderView();">${done ? '✓ ' : ''}${esc(x.name)} (${x.target > 0 ? `${cnt}/${x.target}` : cnt})</button>`;
              }).join('')}
              <button type="button" class="btn ghost sm" style="border-style:dashed;color:var(--amber);border-color:var(--amber);" onclick="openAddTicketItemModal()">+ ${esc(t('addTicketItem'))}</button>
            </div>
          </div>`;
      } else if (sub === 'free') {
        const f = state.tally.free;
        const st = state.tally.style || 'classic';
        topSection = `
          <div class="seg">
            ${[['classic', t('styleClassic')], ['photo', t('stylePhoto')], ['bundle', t('styleBundle')], ['weight', t('styleWeight')]].map(([k, lbl]) =>
              `<button type="button" class="seg-btn ${st === k ? 'teal' : ''}" onclick="state.tally.style='${k}';saveState();renderView();">${esc(lbl)}</button>`
            ).join('')}
          </div>`;

        if (st !== 'classic') {
          root.innerHTML = topSection + renderAltFreeTallyStyle(st, f);
          return;
        }

        topSection += `
          <div class="card" style="padding:7px;">
            <div style="display:grid;grid-template-columns:1fr 110px auto;gap:5px;">
              <input class="inp sm" value="${esc(f.label)}" placeholder="${esc(t('notePh'))}" oninput="state.tally.free.label=this.value;saveState();">
              <input type="number" min="0" class="inp sm mono" value="${f.target || ''}" placeholder="${esc(t('target'))}" oninput="state.tally.free.target=Math.max(0,Math.floor(Number(this.value||0)));saveState();updateTallyStageUi();">
              <button type="button" class="icon-btn sm ${f.lockTarget ? 'on' : ''}" onclick="state.tally.free.lockTarget=!state.tally.free.lockTarget;saveState();renderView();">${f.lockTarget ? '🔒' : '🔓'}</button>
            </div>
          </div>`;
      } else if (sub === 'audit') {
        const br = getEntryBranch();
        const sorted = state.inventory.slice().sort((a, b) => compareItemsSmart(a.name, b.name, a.category || ''));
        const curIt = sorted.find((x) => x.id === Number(state.tally.audit.itemId)) || sorted[0];
        if (curIt) state.tally.audit.itemId = curIt.id;
        topSection = `
          <div class="card" style="padding:7px;">
            <div class="grid-2">
              <select class="sel" onchange="state.tally.audit.itemId=Number(this.value);state.tally.audit.strokes=[];saveState();renderView();">
                ${sorted.map((it) => `<option value="${it.id}" ${it.id === curIt?.id ? 'selected' : ''}>${esc(it.name)} (${getItemStock(it, br)})</option>`).join('')}
              </select>
              <input class="inp mono" readonly value="${esc(t('tSysBal'))}: ${fmtNum(curIt ? getItemStock(curIt, br) : 0)}">
            </div>
          </div>`;

      const isPreset = PRESETS.includes(carry);
      const commitLbl = sub === 'tickets' ? `✅ ${t('postTicket')}` : (sub === 'audit' ? `⚡ ${t('submitAudit')}` : `💾 ${t('saveLog')}`);

      root.innerHTML = `
        ${topSection}
        <div class="card" style="padding:7px;">
          <div class="card-row" style="font-size:10.5px;color:var(--muted);">
            <span>${esc(t('perCarry'))}: <b style="color:var(--teal);font-family:ui-monospace,monospace;">1 = ${carry}</b></span>
            <div style="display:flex;gap:5px;">
              <button type="button" id="btnTPause" class="icon-btn sm ${tallyPaused ? 'locked' : ''}" onclick="toggleTallyPause()">${tallyPaused ? '🔒' : '🔓'}</button>
              <button type="button" class="icon-btn sm" onclick="openTallyCfgModal()">⚙️</button>
            </div>
          </div>
          <div class="preset-grid">
            ${PRESETS.map((n) => `<button type="button" class="preset-btn ${carry === n ? 'active' : ''}" onclick="state.tally.carry=${n};vib(14);saveState();renderView();">+${n}</button>`).join('')}
            <button type="button" class="preset-btn ${!isPreset ? 'active' : ''}" style="color:${!isPreset ? 'var(--teal-dark)' : 'var(--amber)'};" onclick="openTallyNumModal('carry')">${!isPreset ? '+' + carry : esc(t('other'))}</button>
          </div>
        </div>

        <div id="tallyAlertBox" class="alert-box" style="display:none;"></div>

        <div id="tallyStage" class="t-stage">
          <div class="t-prog-track"><div id="tProgFill" class="t-prog-fill"></div></div>
          <div class="t-stats-4">
            <div class="t-kpi"><span class="t-kpi-lbl" id="lblTCounted"></span><span class="t-kpi-val" style="color:#6ee7b7;" id="valTCounted">0</span></div>
            <div class="t-kpi"><span class="t-kpi-lbl" id="lblTStrokes"></span><span class="t-kpi-val" style="color:#5eead4;" id="valTStrokes">0</span></div>
            <div class="t-kpi"><span class="t-kpi-lbl" id="lblTRemQty"></span><span class="t-kpi-val" style="color:#fcd34d;" id="valTRemQty">∞</span></div>
            <div class="t-kpi"><span class="t-kpi-lbl" id="lblTRemLoads"></span><span class="t-kpi-val" style="color:#7dd3fc;" id="valTRemLoads">∞</span></div>
          </div>
          <div id="tallyVisual" class="t-visual"></div>
          <div id="cadenceBar" class="cadence-bar">
            <span id="cadenceTimer" class="cadence-timer stale">${esc(t('noTapYet'))}</span>
            <div id="cadencePills" class="cadence-pills"></div>
          </div>
          <div id="tallyPauseMask" class="t-pause-mask ${tallyPaused ? 'open' : ''}">
            <div style="font-size:26px;">🔒</div>
            <div style="font-size:14px;font-weight:900;color:#fde68a;">${esc(t('pauseTitle'))}</div>
            <div id="lblPauseSub" style="font-size:11.5px;color:var(--muted);"></div>
            <button type="button" class="btn teal" style="border-radius:20px;padding:0 22px;" onclick="setTallyPaused(false)">▶ ${esc(t('resumeBtn'))}</button>
          </div>

              <label class="btn primary sm">📷 ${esc(t('stylePhoto'))}<input type="file" accept="image/*" capture="environment" style="display:none;" onchange="loadTallyPhoto(this)"></label>

              <div><label class="lbl">${esc(t('packSize'))}</label><input type="number" min="1" class="inp mono" value="${f.packSize || 10}" oninput="state.tally.free.packSize=Math.max(1,Number(this.value||1));saveState();renderView();"></div>
              <div><label class="lbl">${esc(L('ፍሬ', 'Loose'))}</label><input type="number" min="0" class="inp mono" value="${f.loose || 0}" oninput="state.tally.free.loose=Math.max(0,Number(this.value||0));saveState();renderView();"></div>
            </div>
            <div class="kpi emerald"><span class="kpi-lbl">${esc(t('total'))}</span><span class="kpi-val">${fmtNum(tot)}</span></div>
            <button type="button" class="btn teal" onclick="saveAltFreeTallyLog(${tot})">💾 ${esc(t('saveLog'))}</button>
          </div>`;
      }
      // weight
      const uw = Math.max(0.01, Number(f.packSize || 1));
      const est = Math.round(Number(f.weight || 0) / uw);
      return `
        <div class="card">
          <div class="grid-2">
            <div><label class="lbl">${esc(t('weightKg'))}</label><input type="number" step="0.1" min="0" class="inp mono" value="${f.weight || 0}" oninput="state.tally.free.weight=Math.max(0,Number(this.value||0));saveState();renderView();"></div>
            <div><label class="lbl">${esc(L('የአንድ ፍሬ ክብደት', 'Unit Weight'))}</label><input type="number" step="0.01" min="0.01" class="inp mono" value="${f.packSize || 1}" oninput="state.tally.free.packSize=Math.max(0.01,Number(this.value||1));saveState();renderView();"></div>
          </div>
          <div class="kpi cyan"><span class="kpi-lbl">${esc(t('counted'))}</span><span class="kpi-val">${fmtNum(est)}</span></div>
          <button type="button" class="btn teal" onclick="saveAltFreeTallyLog(${est})">💾 ${esc(t('saveLog'))}</button>
        </div>`;
    }

    function loadTallyPhoto(inp) {
      const file = inp.files?.[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = () => { state.tally.free.photoUrl = r.result; state.tally.free.markers = []; saveState(); renderView(); };
      r.readAsDataURL(file);
    }

    function addPhotoTallyPin(e, box) {
      const rect = box.getBoundingClientRect();
      const x = Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(1));
      const y = Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(1));
      state.tally.free.markers.push({ x, y });
      vib(20); playTone(560, 0.05);
      saveState(); renderView();
    }

    function saveAltFreeTallyLog(qty) {
      if (qty <= 0) return;
      state.tally.logs.push({ id: Date.now(), item: state.tally.free.label || t('sFreeCount'), qty, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
      saveState(); showToast(t('savedOk'));
    }

    function addNewTallyTicket() {
      const br = getEntryBranch();
      const id = 'tk_' + Date.now();
      state.tally.tickets.push({ id, dir: 'OUT', docNo: getSuggestedEntryDocNo(br), party: '', branch: br, activeItemId: 0, items: [] });
      state.tally.activeTicketId = id;
      saveState(); renderView();
    }

    function deleteActiveTallyTicket() {
      state.tally.tickets = state.tally.tickets.filter((x) => x.id !== state.tally.activeTicketId);
      ensureTallyTicket(); saveState(); renderView();
    }

    function openAddTicketItemModal() {
      const sorted = state.inventory.slice().sort((a, b) => compareItemsSmart(a.name, b.name, a.category || ''));
      openModal(t('addTicketItem'), `
        <select id="tkAddSel" class="sel">${sorted.map((it) => `<option value="${it.id}">${esc(it.name)} (${getItemStock(it, getEntryBranch())})</option>`).join('')}</select>
        <input id="tkAddTrg" type="number" min="0" inputmode="numeric" class="inp mono" placeholder="${esc(t('target'))}">`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn teal" onclick="pushTicketItemNow()">${esc(t('add'))}</button>`);

    function pushTicketItemNow() {
      const itemId = Number(document.getElementById('tkAddSel')?.value || 0);
      const target = Math.max(0, Math.floor(Number(document.getElementById('tkAddTrg')?.value || 0)));
      const it = state.inventory.find((x) => x.id === itemId);
      if (!it) return;
      const tk = getActiveTicket();
      const ex = tk.items.find((x) => x.itemId === itemId);
      if (ex) ex.target = target;
      else tk.items.push({ itemId: it.id, name: it.name, unit: getUnitLabel(it), loc: it.zoneCode || 'A-01', target, strokes: [] });
      tk.activeItemId = itemId;
      saveState(); closeModal(); renderView();
    }

    function setTallyPaused(p) {
      tallyPaused = Boolean(p);
      const mask = document.getElementById('tallyPauseMask');
      const btn = document.getElementById('btnTPause');
      if (mask) mask.classList.toggle('open', tallyPaused);
      if (btn) { btn.textContent = tallyPaused ? '🔒' : '🔓'; btn.classList.toggle('locked', tallyPaused); }
      const sub = document.getElementById('lblPauseSub');
      if (tallyPaused && sub) {
        const ctx = getTallyContext();
        sub.textContent = t('pauseSub')(ctx.strokes.length, fmtNum(sumStrokes(ctx.strokes)));
      }
    }

    function toggleTallyPause() { vib(18); setTallyPaused(!tallyPaused); }

    function addTallyStroke(customQty = null, workerIdx = null) {
      if (tallyPaused) return false;
      const ctx = getTallyContext();
      if (!ctx.enabled) { openAddTicketItemModal(); return false; }

      const cfg = state.tallyCfg;
      const now = Date.now();
      if (customQty === null) {
        if (workerIdx !== null && workerIdx >= 0) {
          const perW = Math.max(1500, Number(cfg.cooldownMs || 0));
          if (now - (workerLastTap[workerIdx] || 0) < perW) return false;
          workerLastTap[workerIdx] = now;
        } else {
          const cd = Math.max(150, Number(cfg.cooldownMs || 0));
          if (now - lastTapMs < cd) return false;
        }
      }
      lastTapMs = now;
      ensureWakeLock();

      const counted = sumStrokes(ctx.strokes);
      if (ctx.hardStop && ctx.target > 0 && counted >= ctx.target) {
        vib([110, 50, 140]); playTone(920, 0.16, 'square', 0.16); return false;
      }

      const carry = Number(state.tally.carry || 5);
      let add = customQty !== null ? Math.floor(Number(customQty)) : carry;
      if (!add || add <= 0) return false;
      let isOdd = add !== carry;
      if (ctx.hardStop && ctx.target > 0 && counted + add > ctx.target) { add = ctx.target - counted; isOdd = add !== carry; }

      const entry = { qty: add, isOdd, ts: now };
      if (workerIdx !== null && workerIdx >= 0) entry.worker = workerIdx;
      ctx.strokes.push(entry);
      saveState();

      const newTot = counted + add;
      const loads = ctx.strokes.length;
      const rem = ctx.target > 0 ? Math.max(0, ctx.target - newTot) : 999999;
      const remLoads = Math.ceil(rem / Math.max(1, carry));
      const strong = Boolean(cfg.strongHaptics);
      const isBatch10 = loads % 10 === 0;

      if (ctx.hardStop && ctx.target > 0 && newTot >= ctx.target) {
        vib([110, 50, 110, 50, 180]); playTone(880, 0.14, 'square'); setTimeout(() => playTone(1175, 0.2, 'square'), 150);
      } else if (ctx.target > 0 && rem > 0 && remLoads <= 3) {
        vib(strong ? [70, 35, 70] : [45, 30, 45]); playTone(780, 0.09, 'sawtooth', 0.14);
      } else if (isBatch10) {
        vib(strong ? [80, 40, 120] : [50, 30, 75]); playTone(760, 0.1, 'triangle');
      } else {
        vib(strong ? 50 : 22); playTone(520, 0.05);
      }

      if (cfg.showTimer) {
        const st = document.getElementById('tallyStage');
        if (st) {
          st.classList.remove('glow-ok', 'glow-batch');
          void st.offsetWidth;
          st.classList.add(isBatch10 ? 'glow-batch' : 'glow-ok');
          if (stageGlowTimer) clearTimeout(stageGlowTimer);
          stageGlowTimer = setTimeout(() => st.classList.remove('glow-ok', 'glow-batch'), 2400);
        }
      }

      speakNumber(newTot);
      updateTallyStageUi();
      if (cfg.carriers >= 2) updateMultiCarrierBadges();
      if (cfg.carriers === 0 && cfg.triggerMode === 'TAP' && cfg.cooldownMs >= 400) animateTapCd();
      return true;
    }

    function updateTallyStageUi() {
      const ctx = getTallyContext();
      const visual = document.getElementById('tallyVisual');
      if (!visual) return;

      const cnt = sumStrokes(ctx.strokes);
      const loads = ctx.strokes.length;
      const trg = ctx.target;
      const mult = Math.max(1, Number(state.tally.carry || 1));

      document.getElementById('lblTCounted').textContent = ctx.dir === 'OUT' ? t('tLoaded') : (ctx.dir === 'IN' ? t('tUnloaded') : t('counted'));
      document.getElementById('lblTStrokes').textContent = t('tLoads');
      document.getElementById('valTCounted').textContent = fmtNum(cnt);
      document.getElementById('valTStrokes').textContent = fmtNum(loads);

      const prog = document.getElementById('tProgFill');
      if (prog) prog.style.width = trg > 0 ? `${Math.min(100, Math.round((cnt / trg) * 100))}%` : '0%';

      const rQtyLbl = document.getElementById('lblTRemQty');
      const rQtyVal = document.getElementById('valTRemQty');
      const rLdLbl = document.getElementById('lblTRemLoads');
      const rLdVal = document.getElementById('valTRemLoads');
      const alertBox = document.getElementById('tallyAlertBox');
      const stage = document.getElementById('tallyStage');

      if (alertBox) { alertBox.style.display = 'none'; alertBox.className = 'alert-box'; }
      if (stage) stage.classList.remove('done', 'near');
      rLdVal.className = 't-kpi-val';

      if (ctx.isAudit) {
        const d = cnt - trg;
        rQtyLbl.textContent = t('variance');
        rQtyVal.textContent = (d > 0 ? '+' : '') + fmtNum(d);
        rLdLbl.textContent = t('tSysBal');
        rLdVal.textContent = fmtNum(trg);
      } else {
        rQtyLbl.textContent = t('tRemQty');
        rLdLbl.textContent = t('tRemLoads');
        if (trg <= 0) {
          rQtyVal.textContent = '∞'; rLdVal.textContent = '∞';
        } else {
          const rem = Math.max(0, trg - cnt);
          const fullL = Math.floor(rem / mult);
          const oddR = rem % mult;
          const remCeil = Math.ceil(rem / mult);
          rQtyVal.textContent = fmtNum(rem);
          if (rem === 0) rLdVal.textContent = '0';
          else if (oddR === 0) rLdVal.textContent = fmtNum(fullL);
          else if (fullL === 0) rLdVal.textContent = `+${oddR}`;
          else { rLdVal.classList.add('sm'); rLdVal.textContent = t('remLoadMix')(fullL, oddR); }

          if (cnt >= trg) {
            alertBox.style.display = 'block'; alertBox.className = 'alert-box stop';
            alertBox.textContent = ctx.hardStop ? t('stopAlert') : t('targetDone');
            stage.classList.add('done');
          } else if (rem < mult) {
            alertBox.style.display = 'block'; alertBox.className = 'alert-box warn';
            alertBox.textContent = t('oddWarn')(rem); stage.classList.add('near');
          } else if (remCeil <= 3) {
            alertBox.style.display = 'block'; alertBox.className = 'alert-box warn';
            alertBox.textContent = t('nearAlert')(remCeil, rem); stage.classList.add('near');
          }
        }
      }

      if (!ctx.enabled) {
        visual.className = 't-visual';
        visual.innerHTML = `<div style="margin:auto;text-align:center;color:var(--muted);font-size:12px;">+ ${esc(t('addTicketItem'))}</div>`;
      } else if (state.tallyCfg.visualMode !== 'TALLY5') {
        visual.className = 't-visual';
        const s = ctx.strokes;
        const compBatches = s.length === 0 ? 0 : Math.floor((s.length - 1) / 10);
        const compSum = sumStrokes(s.slice(0, compBatches * 10));
        const curSlice = s.slice(compBatches * 10);
        const curSum = sumStrokes(curSlice);
        const dots = [];
        for (let i = 0; i < 10; i++) {
          const st = curSlice[i];
          if (st) {
            const wCls = (st.worker !== undefined && st.worker >= 0) ? `w${st.worker % 4}` : (st.isOdd ? 'odd' : 'filled');
            dots.push(`<div class="b-dot ${wCls} ${i === curSlice.length - 1 ? 'latest' : ''}">+${st.qty}</div>`);
          } else dots.push(`<div class="b-dot">${i + 1}</div>`);
        }
        visual.innerHTML = `
          <div class="batch-summary">
            <span style="color:var(--teal);">${esc(t('batchDone')(compBatches, fmtNum(compSum)))}</span>
            <span style="color:var(--muted);">${esc(t('batchCur')(curSlice.length, fmtNum(curSum)))}</span>
          </div>
          <div class="dot-ring">${dots.join('')}</div>`;
      } else {
        visual.className = 't-visual tally-mode';
        const s = ctx.strokes;
        if (!s.length) {
          visual.innerHTML = `<div style="margin:auto;opacity:0.18;"><div class="t-grp" style="transform:scale(1.3);"><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-bar"></div><div class="t-slash"></div></div></div>`;
        } else {
          const skip = s.length > 100 ? Math.floor((s.length - 1) / 100) * 100 : 0;
          let runQ = sumStrokes(s.slice(0, skip));
          let h = skip > 0 ? `<div class="tally-compact-bar">${esc(t('tallyCompBar')(skip, fmtNum(runQ)))}</div>` : '';
          const vis = s.slice(skip);
          for (let r = 0; r < vis.length; r += 25) {
            const rowChunk = vis.slice(r, r + 25);
            runQ += sumStrokes(rowChunk);
            let grps = '';
            for (let g = 0; g < 5; g++) {
              const ch = rowChunk.slice(g * 5, g * 5 + 5);
              if (!ch.length) { grps += '<div></div>'; continue; }
              grps += '<div class="t-grp">';
              for (let b = 0; b < Math.min(4, ch.length); b++) grps += `<div class="t-bar ${ch[b].isOdd ? 'odd' : ''}"></div>`;
              if (ch.length === 5) grps += '<div class="t-slash"></div>';
              grps += '</div>';
            }
            h += `<div class="tally-row-5">${grps}<span class="tally-row-tot">${fmtNum(runQ)}</span></div>`;
          }
          visual.innerHTML = h;
          visual.scrollTop = visual.scrollHeight;
        }
      }
      updateTallyCadence();
    }

    function updateTallyCadence() {
      const bar = document.getElementById('cadenceBar');
      if (!bar) return;
      bar.style.display = state.tallyCfg.showTimer ? 'flex' : 'none';
      if (!state.tallyCfg.showTimer) return;
      const ctx = getTallyContext();
      const s = ctx.strokes;
      const tm = document.getElementById('cadenceTimer');
      const pills = document.getElementById('cadencePills');
      if (!s.length) { tm.className = 'cadence-timer stale'; tm.textContent = t('noTapYet'); pills.innerHTML = ''; return; }
      const diff = Math.max(0, Math.floor((Date.now() - (s[s.length - 1].ts || 0)) / 1000));
      tm.className = 'cadence-timer' + (diff > 5 ? ' stale' : '');
      tm.textContent = diff < 60 ? t('secAgo')(diff) : t('minAgo')(Math.floor(diff / 60), diff % 60);

      const rec = s.slice(-3).reverse();
      pills.innerHTML = rec.map((st, idx) => {
        const ri = s.length - 1 - idx;
        const prev = ri > 0 ? s[ri - 1] : null;
        const gap = prev && prev.ts ? (st.ts - prev.ts) / 1000 : null;
        const fast = gap !== null && gap < 1.3;
        return `<span class="c-pill ${fast ? 'fast' : ''}">#${ri + 1} ${gap !== null ? `(${gap < 10 ? gap.toFixed(1) : Math.round(gap)}s)` : ''}</span>`;
      }).join('');
    }

    function renderTallyTrigger() {
      const area = document.getElementById('tallyTriggerArea');
      if (!area) return;
      const cfg = state.tallyCfg;
      const mult = Number(state.tally.carry || 5);

      if (cfg.carriers >= 2) {
        const n = Math.min(4, Math.max(2, Number(cfg.carriers)));
        area.innerHTML = `
          <div class="mc-grid" style="grid-template-columns:repeat(${n},1fr);">
            ${Array.from({ length: n }, (_, i) => `
              <button type="button" class="mc-btn c${i}" id="mcBtn${i}" onclick="onMultiCarrierTap(${i})">
                <span>${esc(t('workerLbl')(i + 1))} (+${mult})</span>
                <b id="mcCnt${i}" style="font-family:ui-monospace,monospace;font-size:14px;">0</b>
              </button>`).join('')}
          </div>`;
        updateMultiCarrierBadges();
        return;
      }

      if (cfg.triggerMode === 'PINGPONG') {
        area.innerHTML = `
          <div class="pp-grid">
            <button type="button" id="ppBtn0" class="pp-btn ${ppSide === 0 ? 'ready' : ''}" onclick="onPingPongTap(0)">◀ ${esc(t('ppLeft'))} (+${mult})</button>
            <button type="button" id="ppBtn1" class="pp-btn ${ppSide === 1 ? 'ready' : ''}" onclick="onPingPongTap(1)">${esc(t('ppRight'))} (+${mult}) ▶</button>
          </div>`;
        return;
      }

      if (cfg.triggerMode === 'TAP') {
        area.innerHTML = `
          <button type="button" class="tap-btn" onclick="addTallyStroke()">
            <span>⚡ ${esc(t('tapHint')(mult))}</span>
            <div id="tapCdBar" class="tap-cd-bar"></div>
          </button>`;
        return;
      }

      area.innerHTML = `
        <div id="sgTrack" class="sg-track">
          <div id="sgFill" class="sg-fill"></div>
          <span class="sg-label">${esc(t('sgHint')(mult))}</span>
          <div id="sgThumb" class="sg-thumb">❯❯</div>
        </div>`;
      bindSwipeGate();
    }

    function bindSwipeGate() {
      const track = document.getElementById('sgTrack');
      const thumb = document.getElementById('sgThumb');
      const fill = document.getElementById('sgFill');
      if (!track || !thumb || !fill) return;
      let active = false, startX = 0, maxTravel = 1, triggered = false;
      const reset = () => { thumb.classList.add('snap'); thumb.style.transform = 'translate3d(0,0,0)'; fill.style.width = '0%'; };

      track.addEventListener('pointerdown', (e) => {
        if (!e.isPrimary || tallyPaused) return;
        maxTravel = Math.max(40, track.getBoundingClientRect().width - thumb.offsetWidth - 10);
        active = true; triggered = false; startX = e.clientX;
        thumb.classList.remove('snap');
        try { track.setPointerCapture(e.pointerId); } catch {}
      });
      track.addEventListener('pointermove', (e) => {
        if (!active || triggered) return;
        const dx = Math.max(0, Math.min(maxTravel, e.clientX - startX));
        thumb.style.transform = `translate3d(${dx}px,0,0)`;
        fill.style.width = `${Math.round((dx / maxTravel) * 100)}%`;
        if (dx >= maxTravel * 0.64) { triggered = true; active = false; addTallyStroke(null, null); reset(); }
      });
      const end = () => { if (!active) return; active = false; reset(); };
      track.addEventListener('pointerup', end);
      track.addEventListener('pointercancel', end);
    }

    function onPingPongTap(side) {
      if (side !== ppSide) return;
      if (addTallyStroke(null, null)) {
        ppSide = 1 - ppSide;
        document.getElementById('ppBtn0')?.classList.toggle('ready', ppSide === 0);
        document.getElementById('ppBtn1')?.classList.toggle('ready', ppSide === 1);
      }
    }

    function onMultiCarrierTap(idx) {
      if (addTallyStroke(null, idx)) {
        const b = document.getElementById(`mcBtn${idx}`);
        if (b) {
          b.classList.add('cooling');
          setTimeout(() => b.classList.remove('cooling'), Math.max(1500, Number(state.tallyCfg.cooldownMs || 0)));
        }
      }
    }

    function updateMultiCarrierBadges() {
      const ctx = getTallyContext();
      const cnts = [0, 0, 0, 0];
      (ctx.strokes || []).forEach((s) => { if (s.worker >= 0 && s.worker < 4) cnts[s.worker]++; });
      for (let i = 0; i < 4; i++) {
        const el = document.getElementById(`mcCnt${i}`);
        if (el) el.textContent = String(cnts[i]);
      }
    }

    function animateTapCd() {
      const bar = document.getElementById('tapCdBar');
      if (!bar) return;
      bar.style.transition = 'none'; bar.style.width = '100%';
      void bar.offsetWidth;
      bar.style.transition = `width ${state.tallyCfg.cooldownMs}ms linear`;
      bar.style.width = '0%';
    }

    function clearTallyStrokes() {
      const ctx = getTallyContext();
      if (!ctx.strokes.length) return;
      lastUndoStrokes = ctx.strokes.slice();
      ctx.strokes.length = 0; vib(28); saveState(); updateTallyStageUi();

      const v = Math.floor(Number(document.getElementById('inpTNum')?.value || 0));

    function commitActiveTally(btn) {
      const ctx = getTallyContext();
      const sub = ctx.sub;

      if (sub === 'free') {
        const tot = sumStrokes(state.tally.free.strokes);
        if (tot <= 0) return;
        state.tally.logs.push({ id: Date.now(), item: state.tally.free.label || t('sFreeCount'), qty: tot, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
        state.tally.free.strokes = [];
        saveState(); renderView(); showToast(t('savedOk'));
        return;
      }

      if (sub === 'audit') {
        const it = ctx.auditItem;
        if (!it) return;
        const br = getEntryBranch();
        const counted = sumStrokes(state.tally.audit.strokes);
        const sysBal = getItemStock(it, br);
        const diff = counted - sysBal;
        const today = new Date().toISOString().slice(0, 10);

        if (hasPerm('approve')) {
          it.branchStock[br] = counted;
          state.warehouseLedger.push({
            id: Date.now(), docNo: 'ADJ-' + Math.floor(100 + Math.random() * 900), type: 'ADJ', status: 'valid',
            branch: br, itemId: it.id, itemName: it.name, unit: getUnitLabel(it), loc: it.zoneCode || 'A-01',
            openBal: sysBal, inQty: diff > 0 ? diff : 0, outQty: diff < 0 ? Math.abs(diff) : 0, endBal: counted,
            party: curUser().name, ref: t('sAudit'), date: today
          });
          showToast(t('approvedDone'));
        } else {
          state.pendingApprovals.push({
            id: Date.now(), itemId: it.id, itemName: it.name, branch: br,
            sysBal, counted, diff, requestedBy: curUser().name, date: today
          });
          showToast(t('pendingApproval'));
        }
        state.tally.audit.strokes = [];
        saveState(); renderAll();
        return;
      }

      // የጭነት ቲኬት ቀጥታ መዝግብ
      const tk = getActiveTicket();
      const lines = tk.items.map((x) => ({ itemId: x.itemId, name: x.name, qty: sumStrokes(x.strokes) })).filter((x) => x.qty > 0);
      if (!lines.length) return;
      withBusy(btn, async () => {
        const ok = executeWarehouseMovement(tk.dir, { docNo: tk.docNo, party: tk.party || '-', ref: t('sTickets') }, tk.branch || getEntryBranch(), lines, () => {
          state.tally.tickets = state.tally.tickets.filter((x) => x.id !== tk.id);
          ensureTallyTicket();
        });
        if (ok) renderAll();
      });
    }

    function getLockedPageSizeMm(cfg) {
      const c = cfg || state.pdfCfg;
      if (c.mode === 'MOBILE') return { w: 110, h: 215 };
      if (c.mode === 'A4_L') return { w: 297, h: 210 };
      if (c.mode === 'A5_P') return { w: 148, h: 210 };
      if (c.mode === 'CUSTOM') {
        return {
          w: Math.max(70, Number(c.widthMm) || 110),
          h: Math.max(100, Number(c.heightMm) || 215)
        };
      }
      return { w: 210, h: 297 };
    }

    function buildStockColgroupHtml(cols, cfg) {
      const cw = { ...DEFAULT_PDF_CFG.colW, ...(cfg?.colW || {}) };
      const raw = cols.map((c) => Math.max(6, Number(cw[c.k] || 14)));
      const sum = raw.reduce((s, n) => s + n, 0) || 100;
      return `<colgroup>${raw.map((w) => `<col style="width:${((w / sum) * 100).toFixed(2)}%;">`).join('')}</colgroup>`;
    }

    function getPdfStyleTokens(cfg) {
      const c = { ...DEFAULT_PDF_CFG, ...(cfg || {}) };
      const fPx = Math.max(8, Math.min(22, Number(c.fontSizePx) || 13));
      const fSize = `${fPx}px`;
      const rowH = Math.max(18, Math.min(46, Number(c.rowHeight) || 26));
      const padY = Math.max(2, Math.round((rowH - fPx * 1.25) / 2));
      const vAlign = c.vAlign === 'top' || c.vAlign === 'bottom' ? c.vAlign : 'middle';
      const txtAlign = c.textAlign === 'center' || c.textAlign === 'right' ? c.textAlign : 'left';
      const numAlign = c.numAlign === 'left' || c.numAlign === 'right' ? c.numAlign : 'center';
      const txtPadX = `${Math.max(0, Number(c.textPadX ?? 6))}px`;
      const numPadX = `${Math.max(0, Number(c.numPadX ?? 4))}px`;
      const fontStyle = c.italic ? 'italic' : 'normal';
      const baseWt = c.bold ? 800 : 500;
      const keyWt = c.bold ? 900 : 700;

      const isDark = c.stylePreset === 'dark';
      const brdColor = c.borderStyle === 'bold'

          rowZeroBg: '#f8d7da', rowZeroClr: '#991b1b',
          rowLowBg: '#fff3cd', rowLowClr: '#92400e',
          rowInBg: '#d1fae5', rowAdjBg: '#dbeafe',

        },
        dark: {

          catBg: '#b7e1cd', catClr: '#052e16',

          footOpenClr: '#f8fafc', footInClr: '#86efac', footOutClr: '#fca5a5', footAdjClr: '#7dd3fc', footBalClr: '#fde047',

          rowZeroBg: '#3b1114', rowZeroClr: '#fca5a5',
          rowLowBg: '#3a290b', rowLowClr: '#fde68a',
          rowInBg: '#063322', rowAdjBg: '#122645',
          spacerBg: '#0b0f17', mutedClr: '#94a3b8'

          catBg: '#f1f5f9', catClr: '#000000',
          footBg: '#e2e8f0', footClr: '#000000',
          footOpenClr: '#000000', footInClr: '#000000', footOutClr: '#000000', footAdjClr: '#000000', footBalClr: '#000000',
          rowNormalBg: '#ffffff', rowNormalClr: '#000000',
          rowZeroBg: '#ffffff', rowZeroClr: '#000000',
          rowLowBg: '#ffffff', rowLowClr: '#000000',

      const theme = { ...(presets[c.stylePreset] || presets.classic) };

        theme.thBg = c.headerBg; theme.thClr = '#ffffff';
        theme.bannerBg = c.headerBg; theme.bannerClr = '#ffffff';
      }

      const bannerCss = `background:${theme.bannerBg};color:${theme.bannerClr};border:${theme.bannerBorder};`;
      const tdTextCss = (isItem = false) =>
        `height:${rowH}px;padding:${padY}px ${txtPadX};border:${border};text-align:${txtAlign};vertical-align:${vAlign};font-weight:${isItem ? keyWt : baseWt};font-style:${fontStyle};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`;

        ...DEFAULT_PDF_CFG,
        ...state.pdfCfg,
        colW: { ...DEFAULT_PDF_CFG.colW, ...(state.pdfCfg?.colW || {}) }
      };
      pdfStudioTab = 'FMT';

      openModal(t('mPdfStudio'), `
        <div class="pdf-preview-wrap">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:10px;font-weight:900;">
            <span style="color:var(--teal);">👁️ ${esc(t('pdfPreviewLbl'))}</span>
            <span id="pdfPrevDimTag" style="font-family:ui-monospace,monospace;color:var(--primary);"></span>

    function setPdfStudioTab(tab) { vib(12); pdfStudioTab = tab; renderPdfStudioPanel(); }
    function setPdfDraftVal(k, v, rerender = true) {
      vib(10);
      pdfDraft[k] = v;
      if (k === 'stylePreset') pdfDraft.headerBg = '';
      if (rerender) renderPdfStudioPanel(); else updatePdfLivePreview();
    }
    function stepPdfDraft(k, d, minV, maxV) {
      vib(12);
      pdfDraft[k] = Math.max(minV, Math.min(maxV, Number(pdfDraft[k] || minV) + d));
      renderPdfStudioPanel();
    }
    function setPdfColW(k, val) {
      pdfDraft.colW[k] = Math.max(6, Math.min(70, Number(val || 14)));
      const sp = document.getElementById(`cwVal_${k}`);
      if (sp) sp.textContent = `${pdfDraft.colW[k]}%`;
      updatePdfLivePreview();
    }
    function resetPdfColWidths() { vib(14); pdfDraft.colW = { ...DEFAULT_PDF_CFG.colW }; renderPdfStudioPanel(); }

    function updatePdfLivePreview() {
      const box = document.getElementById('pdfLivePreview');
      if (!box || !pdfDraft) return;
      const st = getPdfStyleTokens(pdfDraft);
      const sz = getLockedPageSizeMm(pdfDraft);
      const tag = document.getElementById('pdfPrevDimTag');
      if (tag) tag.textContent = `${sz.w}×${sz.h} · ${st.fPx}px`;

      const showAdj = pdfDraft.adjColMode !== 'HIDE';
      const cols = [{ k: 'item', lbl: t('item') }];
      if (pdfDraft.showOpening) cols.push({ k: 'open', lbl: t('openingBal') });
      cols.push({ k: 'inq', lbl: t('totalIn') }, { k: 'outq', lbl: t('totalOut') });
      if (showAdj) cols.push({ k: 'adj', lbl: t('adjCol') });
      cols.push({ k: 'bal', lbl: t('endingBal') });

      const sample = [
        { item: state.inventory[0]?.name || t('item'), open: '40', inq: '15', outq: '5', adj: '0', bal: '50', low: false },
        { item: state.inventory[2]?.name || t('item'), open: '10', inq: '0', outq: '8', adj: '0', bal: '2', low: true }
      ];

      box.style.background = st.theme.pageBg;
      box.innerHTML = `
        <div style="${st.bannerCss}padding:5px 6px;text-align:center;font-size:${Math.min(13, st.fPx)}px;font-weight:900;margin-bottom:2px;">${esc(getOrgName())} — ${esc((pdfDraft.headerSub || '').trim() || t('sStockReport'))}</div>
        <table style="width:100%;border-collapse:collapse;table-layout:fixed;font-size:${st.fSize};">
          ${buildStockColgroupHtml(cols, pdfDraft)}
          <thead><tr>${cols.map((c) => `<th style="${st.thCss}">${esc(c.lbl)}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td colspan="${cols.length}" style="${st.catCss}">${esc(state.inventory[0]?.category || t('category'))}</td></tr>
            ${sample.map((r) => {
              const bg = r.low ? st.theme.rowLowBg : st.theme.rowNormalBg;
              const clr = r.low ? st.theme.rowLowClr : st.theme.rowNormalClr;
              return `<tr style="background:${bg};color:${clr};">${cols.map((c) => {
                if (c.k === 'item') return `<td style="${st.tdTextCss(true)}">${esc(r.item)}</td>`;
                if (c.k === 'bal') return `<td style="${st.tdNumCss(true)}">${r.bal}</td>`;
                return `<td style="${st.tdNumCss(false)}">${r[c.k]}</td>`;
              }).join('')}</tr>`;
            }).join('')}
          </tbody>
        </table>`;
    }

        generateAndDeliverPdf(scope, onlyIds, mode, todayOnly, null, chId);
        if (onlyIds) clearPdfSelection();
      };

      const plats = t('platforms');

      openModal(t('destTitle'), `
        <div class="sub-card">
          ${chList.length ? `<button type="button" class="btn teal" onclick="closeModal();window.__pdfDestPick('channel','')">📡 ${esc(t('sendAllCh'))}</button>` : ''}
          ${chList.map((c) => `
            <button type="button" class="btn muted" style="justify-content:flex-start;" onclick="closeModal();window.__pdfDestPick('channel','${c.id}')">
              📡 ${esc(c.label)} · ${esc(plats[c.platformIdx] || plats[0])}
            </button>`).join('')}
          <button type="button" class="btn primary" onclick="closeModal();window.__pdfDestPick('share','')">📱 ${esc(t('sendViaPhone'))}</button>
          <button type="button" class="btn muted" onclick="closeModal();window.__pdfDestPick('download','')">⬇️ ${esc(t('downloadLocal'))}</button>
        </div>`, `

    async function generateAndDeliverPdf(scope, onlyIds, deliveryMode, todayOnly = false, btn = null, channelId = '') {
      if (!window.html2canvas || !window.jspdf) { window.print(); return; }
      await withBusy(btn, async () => {
        showToast(t('pdfPreparing'));
        const cfg = state.pdfCfg;
        const st = getPdfStyleTokens(cfg);
        const sz = getLockedPageSizeMm(cfg);
        const pw = sz.w * 2.83465;
        const ph = sz.h * 2.83465;
        const orient = pw > ph ? 'l' : 'p';
        const stagePx = Math.max(340, Math.min(1100, Math.round(sz.w * 3.7795)));
        const pagePxH = Math.round(stagePx * (sz.h / sz.w));
        const padPx = stagePx <= 520 ? 10 : 18;
        const innerW = stagePx - padPx * 2;
        const dateStr = new Date().toISOString().slice(0, 10);
        const subTitle = (cfg.headerSub || '').trim() || (scope === 'stock' ? t('sStockReport') : (scope === 'fin' ? t('sFinReport') : (todayOnly ? t('todayOnly') : t('sLedger'))));
        const reportTitle = `${getOrgName()} — ${subTitle} (${dateStr})`;

        let colgroupHtml = '';
        let tableStyleExtra = '';
        let headHtml = '';
        let footHtml = '';
        let endRow = '';
        const units = [];

        if (scope === 'stock') {
          const allRows = computePeriodStockRows(state.stockPeriod);
          const list = onlyIds
            ? allRows.filter((r) => onlyIds.includes(String(r.id)))
            : allRows.filter((r) => cfg.stockShowZero || r.curQty > 0 || r.inQ > 0 || r.outQ > 0 || r.adjQ !== 0);

          const byCat = {};
          list.forEach((r) => { const c = r.category || t('allCategories'); if (!byCat[c]) byCat[c] = []; byCat[c].push(r); });
          const groups = Object.keys(byCat).sort().map((cat) => ({ cat, items: byCat[cat].sort((a, b) => compareItemsSmart(a.name, b.name, cat)) }));

          const hasAdj = list.some((r) => r.adjQ !== 0);
          const showAdj = cfg.adjColMode === 'SHOW' || (cfg.adjColMode !== 'HIDE' && hasAdj);
          const cols = [{ k: 'item', lbl: t('item') }];
          if (cfg.showOpening) cols.push({ k: 'open', lbl: t('openingBal') });
          cols.push({ k: 'inq', lbl: t('totalIn') }, { k: 'outq', lbl: t('totalOut') });
          if (showAdj) cols.push({ k: 'adj', lbl: t('adjCol') });
          cols.push({ k: 'bal', lbl: t('endingBal') });

          colgroupHtml = buildStockColgroupHtml(cols, cfg);
          tableStyleExtra = 'table-layout:fixed;';
          headHtml = `<thead><tr>${cols.map((c) => `<th style="${st.thCss}">${esc(c.lbl)}</th>`).join('')}</tr></thead>`;
          endRow = `<tr><td colspan="${cols.length}" style="text-align:center;padding:5px;color:${st.theme.mutedClr};font-size:9.5px;font-weight:700;border:none;">✦ ${esc(t('pdfEndList'))} ✦</td></tr>`;

          let opT = 0, inT = 0, outT = 0, adjT = 0, clT = 0;
          groups.forEach((grp, gIdx) => {
            const catTr = `<tr><td colspan="${cols.length}" style="${st.catCss}">${esc(grp.cat)}</td></tr>`;
            const spTr = gIdx > 0 ? `<tr style="background:${st.theme.spacerBg};"><td colspan="${cols.length}" style="height:6px;border:none;"></td></tr>` : '';
            grp.items.forEach((r, idx) => {
              opT += r.openQ; inT += r.inQ; outT += r.outQ; adjT += r.adjQ; clT += r.curQty;
              const bg = r.curQty === 0 ? st.theme.rowZeroBg : (r.curQty <= 15 ? st.theme.rowLowBg : st.theme.rowNormalBg);
              const clr = r.curQty === 0 ? st.theme.rowZeroClr : (r.curQty <= 15 ? st.theme.rowLowClr : st.theme.rowNormalClr);
              const tr = `<tr style="background:${bg};color:${clr};">${cols.map((c) => {
                if (c.k === 'item') return `<td style="${st.tdTextCss(true)}">${esc(r.name)}</td>`;
                if (c.k === 'open') return `<td style="${st.tdNumCss(false)}">${fmtNum(r.openQ)}</td>`;
                if (c.k === 'inq') return `<td style="${st.tdNumCss(false)}">${fmtNum(r.inQ)}</td>`;
                if (c.k === 'outq') return `<td style="${st.tdNumCss(false)}">${fmtNum(r.outQ)}</td>`;
                if (c.k === 'adj') return `<td style="${st.tdNumCss(false)}">${fmtNum(r.adjQ)}</td>`;
                return `<td style="${st.tdNumCss(true)}">${fmtNum(r.curQty)}</td>`;
              }).join('')}</tr>`;
              if (idx === 0) units.push({ rows: spTr ? [spTr, catTr, tr] : [catTr, tr], cleanTop: catTr + tr });
              else units.push({ rows: [tr], cleanTop: tr });
            });
          });

          const fTds = cols.map((c) => {
            if (c.k === 'item') return `<td style="padding:6px ${st.txtPadX};text-align:${st.txtAlign};">${esc(t('totalRow'))} (${list.length})</td>`;
            if (c.k === 'open') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footOpenClr};">${fmtNum(opT)}</td>`;
            if (c.k === 'inq') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footInClr};">${fmtNum(inT)}</td>`;
            if (c.k === 'outq') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footOutClr};">${fmtNum(outT)}</td>`;
            if (c.k === 'adj') return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footAdjClr};">${fmtNum(adjT)}</td>`;
            return `<td style="padding:6px ${st.numPadX};text-align:${st.numAlign};color:${st.theme.footBalClr};">${fmtNum(clT)}</td>`;
          }).join('');
          footHtml = `<table style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}<tbody><tr style="background:${st.theme.footBg};color:${st.theme.footClr};font-weight:900;border:${st.theme.thBorder};">${fTds}</tr></tbody></table>`;
        } else if (scope === 'fin') {
          const list = state.salesLedger.filter((s) => s.status === 'valid' && (!onlyIds || onlyIds.includes(String(s.id))) && (state.branchScope === 'all' || s.branch === state.branchScope));
          const cols = [
            { k: 'doc', lbl: t('docNo') },
            { k: 'cust', lbl: t('customer') },
            { k: 'item', lbl: t('item') },
            { k: 'qty', lbl: t('qty') },
            { k: 'tot', lbl: t('total') },
            { k: 'dt', lbl: t('dateCol') }
          ];
          headHtml = `<thead><tr>${cols.map((c) => `<th style="${st.thCss}">${esc(c.lbl)}</th>`).join('')}</tr></thead>`;
          endRow = `<tr><td colspan="${cols.length}" style="text-align:center;padding:5px;color:${st.theme.mutedClr};font-size:9.5px;border:none;">✦ ${esc(t('pdfEndList'))} ✦</td></tr>`;
          let grand = 0;
          list.forEach((s) => {
            grand += Number(s.total || 0);
            const tr = `<tr style="background:${st.theme.rowNormalBg};color:${st.theme.rowNormalClr};">
              <td style="${st.tdNumCss(false)}">${esc(s.invNo)}</td>
              <td style="${st.tdTextCss(false)}">${esc(s.customer)}</td>
              <td style="${st.tdTextCss(true)}">${esc(s.itemName)}</td>
              <td style="${st.tdNumCss(false)}">${fmtNum(s.qty)} ${esc(s.unit)}</td>
              <td style="${st.tdNumCss(true)}">${fmtMoney(s.total)}</td>
              <td style="${st.tdNumCss(false)}">${esc(s.date)}</td>
            </tr>`;
            units.push({ rows: [tr], cleanTop: tr });
          });
          footHtml = `<table style="width:100%;border-collapse:collapse;font-size:${st.fSize};"><tbody><tr style="background:${st.theme.footBg};color:${st.theme.footClr};font-weight:900;border:${st.theme.thBorder};"><td colspan="4" style="padding:6px 8px;">${esc(t('totalRow'))} (${list.length})</td><td colspan="2" style="padding:6px 8px;text-align:right;color:${st.theme.footBalClr};">${fmtMoney(grand)}</td></tr></tbody></table>`;
        } else {
          let list = state.warehouseLedger.filter((r) => (!onlyIds || onlyIds.includes(String(r.id))) && (state.branchScope === 'all' || r.branch === state.branchScope));
          if (todayOnly) list = list.filter((r) => r.date === dateStr);
          list = getSortedLedgerRows(list);
          const cols = [{ k: 'doc', lbl: t('docNo') }, { k: 'item', lbl: t('item') }];
          if (cfg.showOpening) cols.push({ k: 'open', lbl: t('openingBal') });
          cols.push({ k: 'inq', lbl: t('totalIn') }, { k: 'outq', lbl: t('totalOut') }, { k: 'bal', lbl: t('endingBal') });
          if (cfg.showParty) cols.push({ k: 'party', lbl: t('party') });
          cols.push({ k: 'dt', lbl: t('dateCol') });

          headHtml = `<thead><tr>${cols.map((c) => `<th style="${st.thCss}">${esc(c.lbl)}</th>`).join('')}</tr></thead>`;
          endRow = `<tr><td colspan="${cols.length}" style="text-align:center;padding:5px;color:${st.theme.mutedClr};font-size:9.5px;border:none;">✦ ${esc(t('pdfEndList'))} ✦</td></tr>`;
          let inT = 0, outT = 0;
          list.forEach((r) => {
            const isV = r.status === 'void';
            if (!isV) { inT += Number(r.inQty || 0); outT += Number(r.outQty || 0); }
            const bg = isV ? st.theme.rowZeroBg : (r.type === 'IN' ? st.theme.rowInBg : (r.type === 'ADJ' ? st.theme.rowAdjBg : (r.endBal === 0 ? st.theme.rowLowBg : st.theme.rowNormalBg)));
            const clr = isV ? st.theme.rowZeroClr : (r.endBal === 0 ? st.theme.rowLowClr : st.theme.rowNormalClr);
            const tr = `<tr style="background:${bg};color:${clr};">${cols.map((c) => {
              if (c.k === 'doc') return `<td style="${st.tdNumCss(false)}">${esc(r.docNo)}</td>`;
              if (c.k === 'item') return `<td style="${st.tdTextCss(true)}">${esc(isV ? t('voidWord') : r.itemName)}</td>`;
              if (c.k === 'open') return `<td style="${st.tdNumCss(false)}">${isV ? '-' : fmtNum(r.openBal)}</td>`;
              if (c.k === 'inq') return `<td style="${st.tdNumCss(false)}">${!isV && r.inQty ? fmtNum(r.inQty) : ''}</td>`;
              if (c.k === 'outq') return `<td style="${st.tdNumCss(false)}">${!isV && r.outQty ? fmtNum(r.outQty) : ''}</td>`;
              if (c.k === 'bal') return `<td style="${st.tdNumCss(true)}">${isV ? '-' : fmtNum(r.endBal)}</td>`;
              if (c.k === 'party') return `<td style="${st.tdTextCss(false)}">${esc(r.party)}</td>`;
              return `<td style="${st.tdNumCss(false)}">${esc(r.date)}</td>`;
            }).join('')}</tr>`;
            units.push({ rows: [tr], cleanTop: tr });
          });
          footHtml = `<table style="width:100%;border-collapse:collapse;font-size:${st.fSize};"><tbody><tr style="background:${st.theme.footBg};color:${st.theme.footClr};font-weight:900;border:${st.theme.thBorder};"><td style="padding:6px 8px;">${esc(t('totalRow'))} (${list.length})</td><td style="padding:6px 8px;text-align:center;color:${st.theme.footInClr};">+${fmtNum(inT)}</td><td style="padding:6px 8px;text-align:center;color:${st.theme.footOutClr};">-${fmtNum(outT)}</td></tr></tbody></table>`;
        }

        if (!units.length) {
          units.push({ rows: [`<tr><td colspan="8" style="text-align:center;padding:22px;color:${st.theme.mutedClr};border:${st.border};">${esc(t('noData'))}</td></tr>`], cleanTop: '' });
        }

        const bannerFont = stagePx <= 520 ? Math.max(11, Math.min(14.5, st.fPx)) : 13.5;
        const bannerHtml = `<div style="${st.bannerCss}padding:7px 8px;text-align:center;font-size:${bannerFont}px;font-weight:900;margin-bottom:2px;">${esc(reportTitle)}</div>`;
        const noteHtml = (cfg.footerNote || '').trim() ? `<div style="margin-top:6px;font-size:10.5px;font-weight:700;color:${st.theme.mutedClr};text-align:center;">${esc(cfg.footerNote.trim())}</div>` : '';
        const signHtml = cfg.showSign ? `<div style="display:flex;justify-content:space-between;margin-top:16px;padding:0 10px;font-size:10.5px;font-weight:800;color:${st.theme.textClr};"><span>${esc(t('pdfPrepBy'))}: _________________</span><span>${esc(t('pdfAppBy'))}: _________________</span></div>` : '';
        const finalFoot = `${footHtml}${noteHtml}${signHtml}`;

        const stage = document.getElementById('pdfStage');
        stage.style.width = `${innerW}px`;
        stage.innerHTML = `<div id="pMHead">${bannerHtml}<table style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}${headHtml}</table></div>
          <div id="pMFoot">${finalFoot}</div>
          <table id="pMProbe" style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">${colgroupHtml}<tbody></tbody></table>`;

        const headH = document.getElementById('pMHead').offsetHeight;
        const footH = document.getElementById('pMFoot').offsetHeight + 20;
        const maxNorm = Math.max(120, pagePxH - padPx * 2 - headH - 22);
        const maxLast = Math.max(80, maxNorm - footH);
        const probeBody = document.querySelector('#pMProbe tbody');

        const measured = units.map((u) => {
          probeBody.innerHTML = u.rows.join('');
          return { html: u.rows.join(''), cleanTop: u.cleanTop || u.rows.join(''), h: probeBody.offsetHeight || st.rowH };
        });

        const pages = [];
        let cur = [], curH = 0;
        measured.forEach((m) => {
          if (cur.length && curH + m.h > maxNorm) {
            pages.push({ rows: cur, usedH: curH });
            cur = [m.cleanTop]; curH = m.h;
          } else {
            cur.push(cur.length === 0 ? m.cleanTop : m.html);
            curH += m.h;
          }
        });
        if (cur.length) pages.push({ rows: cur, usedH: curH });
        if (!pages.length) pages.push({ rows: [], usedH: 0 });
        if (pages[pages.length - 1].usedH > maxLast) pages.push({ rows: [], usedH: 0 });

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: orient, unit: 'pt', format: [pw, ph], compress: true });
        const actualW = pdf.internal.pageSize.getWidth();
        const actualH = pdf.internal.pageSize.getHeight();
        const scale = stagePx <= 520 ? 2.0 : 1.5;

        stage.style.width = `${stagePx}px`;
        for (let i = 0; i < pages.length; i++) {
          const isLast = i === pages.length - 1;
          stage.innerHTML = `
            <div class="pdf-page-box" style="width:${stagePx}px;height:${pagePxH}px;padding:${padPx}px;background:${st.theme.pageBg};color:${st.theme.textClr};">
              <div>${bannerHtml}</div>
              <div class="pdf-page-body">
                <table style="width:100%;border-collapse:collapse;font-size:${st.fSize};${tableStyleExtra}">
                  ${colgroupHtml}${headHtml}
                  <tbody>${pages[i].rows.join('')}${isLast ? endRow : ''}</tbody>
                </table>
              </div>
              <div class="pdf-page-foot">
                ${isLast ? finalFoot : ''}
                <div style="text-align:right;font-size:10px;font-weight:800;color:${st.theme.mutedClr};margin-top:4px;">${i + 1} / ${pages.length}</div>
              </div>
            </div>`;
          const canvas = await window.html2canvas(stage.firstElementChild, {
            scale, backgroundColor: st.theme.pageBg, width: stagePx, height: pagePxH, windowWidth: stagePx, windowHeight: pagePxH
          });
          if (i > 0) pdf.addPage([pw, ph], orient);
          pdf.addImage(canvas.toDataURL('image/jpeg', 0.86), 'JPEG', 0, 0, actualW, actualH, undefined, 'FAST');
        }
        stage.innerHTML = '';

        const fileName = `KoraStock_${scope}_${dateStr}.pdf`;
        const blob = pdf.output('blob');

        if (deliveryMode === 'share') {
          try {
            const file = new File([blob], fileName, { type: 'application/pdf' });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: reportTitle });
              return;
            }
          } catch {}
        }

        if (deliveryMode === 'channel' && cloudSession?.token && navigator.onLine) {
          try {
            const fd = new FormData();
            fd.append('token', cloudSession.token);
            fd.append('report_title', reportTitle);
            fd.append('data_tier', scope === 'fin' ? 'FULL_FINANCE' : 'QTY_ONLY');
            if (channelId) fd.append('channel_id', channelId);
            fd.append('lang', state.lang);
            fd.append('file', blob, fileName);
            const r = await fetch(`${KORA_CLOUD.url}/functions/v1/${KORA_CLOUD.notifyFn}`, {
              method: 'POST',
              headers: { apikey: KORA_CLOUD.key, Authorization: `Bearer ${KORA_CLOUD.key}`, 'x-session-token': cloudSession.token },
              body: fd
            }).then((x) => x.json());
            if (r?.success) { showToast(t('savedOk')); return; }
          } catch {}
        }

        pdf.save(fileName);
        showToast(t('savedOk'));
      });
    }

    function downloadCsvFile(filename, headers, rows) {
      const csv = '\uFEFF' + [headers, ...rows].map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
      URL.revokeObjectURL(url);
      showToast(t('savedOk'));
    }

    function exportFinancialCsv() {
      const rows = state.salesLedger.filter((s) => s.status === 'valid' && (state.branchScope === 'all' || s.branch === state.branchScope));
      const hdr = [t('docNo'), t('customer'), t('item'), t('qty'), t('unit'), t('unitPrice'), t('total')];
      if (hasPerm('profit')) hdr.push(t('profit'));
      hdr.push(t('dateCol'));
      const data = rows.map((s) => {
        const r = [s.invNo, s.customer, s.itemName, s.qty, s.unit, s.unitPrice, s.total];
        if (hasPerm('profit')) r.push(s.profit);
        r.push(s.date);
        return r;
      });
      downloadCsvFile(`KoraStock_Financial_${new Date().toISOString().slice(0, 10)}.csv`, hdr, data);
    }

    function exportStockCsv() {
      const hdr = [t('item'), t('category'), t('location'), t('unit'), t('endingBal')];
      const data = state.inventory.map((i) => [i.name, i.category, formatLoc(i), getUnitLabel(i), getItemStock(i, state.branchScope)]);
      downloadCsvFile(`KoraStock_Stock_${new Date().toISOString().slice(0, 10)}.csv`, hdr, data);
    }

    // ባለብዙ-ፎርማት እና ባለሚስጥር-ደረጃ መልዕክት አላላክ
    function dispatchNotifications(eventKey, payload) {
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const plats = t('platforms');
      (state.channels || []).filter((c) => c.active).forEach((ch) => {
        const isQty = ch.tier === 'qty';
        const cleanItems = (payload.items || []).map((it) => ({
          name: it.name, qty: it.qty || 0, unit: it.unit || '', loc: it.loc || '',
          total: isQty ? null : (it.total ?? null)
        }));
        state.sentLogs.push({
          id: Date.now() + Math.floor(Math.random() * 10000),
          channel: `${ch.label} · ${plats[ch.platformIdx] || plats[0]}`,
          tier: ch.tier,
          format: ch.format,
          docNo: isQty ? (payload.branchDoc || payload.docNo) : payload.docNo,
          party: payload.party || '-',
          branch: payload.branch || '-',
          items: cleanItems,
          total: isQty ? null : (payload.total ?? null),
          profit: isQty ? null : (payload.profit ?? null),
          time
        });
      });
      if (state.sentLogs.length > 50) state.sentLogs = state.sentLogs.slice(-50);
    }

    function sendRiskAuditReport() {
      const low = state.inventory.filter((i) => getItemStock(i, state.branchScope) <= 15).map((i) => ({
        name: i.name, qty: getItemStock(i, state.branchScope), unit: getUnitLabel(i), loc: i.zoneCode || '-', total: null
      }));
      dispatchNotifications('risk', {
        docNo: 'RISK-' + new Date().toISOString().slice(5, 10),
        branchDoc: 'RISK', party: t('sAlerts'),
        branch: state.branchScope === 'all' ? t('allBranches') : state.branchScope,
        items: low, total: null, profit: null
      });
      if (cloudSession?.token && navigator.onLine) {
        cloudNotify({ action: 'send_risk_audit' }).catch(() => {});
      }
      saveState();
      if (state.activeMainTab === 'setup:channels') renderSetupPage('channels');
      showToast(t('savedOk'));
    }

    function openImageSlipModal(logId) {
      const log = state.sentLogs.find((x) => x.id === logId);
      if (!log) return;
      const isQty = log.tier === 'qty';
      openModal(`${t('image')} · ${log.docNo}`, `
        <div style="display:flex;flex-direction:column;align-items:center;">
          <canvas id="slipCanvas" width="440" height="${230 + (log.items || []).length * 32}" style="max-width:100%;border-radius:14px;border:1px solid var(--border-strong);"></canvas>
        </div>`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('close'))}</button>
        <button type="button" class="btn teal" onclick="downloadCanvasImage('${esc(log.docNo)}')">⬇️ ${esc(t('download'))}</button>`);

      setTimeout(() => {
        const cv = document.getElementById('slipCanvas');
        if (!cv) return;
        const ctx = cv.getContext('2d');
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
        ctx.fillStyle = isQty ? '#065f46' : '#0f172a'; ctx.fillRect(0, 0, cv.width, 62);
        ctx.fillStyle = '#ffffff'; ctx.font = 'bold 17px sans-serif'; ctx.fillText(getOrgName(), 18, 28);
        ctx.fillStyle = '#a7f3d0'; ctx.font = '12px sans-serif'; ctx.fillText(isQty ? t('tierQtyOnly') : t('tierFullFin'), 18, 48);

        ctx.fillStyle = '#0f172a'; ctx.font = 'bold 13px monospace';
        ctx.fillText(`${t('docNo')}: ${log.docNo}   |   ${log.time}`, 18, 88);
        ctx.font = '12px sans-serif';
        ctx.fillText(`${t('party')}: ${log.party}`, 18, 110);
        ctx.fillText(`${t('mBranches')}: ${log.branch}`, 18, 130);
        ctx.strokeStyle = '#cbd5e1'; ctx.beginPath(); ctx.moveTo(18, 144); ctx.lineTo(422, 144); ctx.stroke();

        let y = 170;
        (log.items || []).forEach((it, idx) => {
          ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12.5px sans-serif';
          ctx.fillText(`${idx + 1}. ${it.name}`, 18, y);
          ctx.font = 'bold 12.5px monospace';
          ctx.fillStyle = isQty ? '#047857' : '#0369a1';
          ctx.fillText(isQty ? `${fmtNum(it.qty)} ${it.unit} · ${it.loc}` : `${fmtNum(it.qty)} ${it.unit} · ${it.total != null ? fmtMoney(it.total) : '-'}`, 230, y);
          y += 30;
        });

        ctx.beginPath(); ctx.moveTo(18, y - 6); ctx.lineTo(422, y - 6); ctx.stroke();
        ctx.fillStyle = isQty ? '#065f46' : '#0f172a';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText(!isQty && log.total != null ? `${t('total')}: ${fmtMoney(log.total)}` : t('tierQtyOnly'), 18, y + 18);
      }, 30);
    }

        : [log.docNo, log.branch, log.party, it.name, it.qty, it.unit, it.total || 0]);
