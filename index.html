    function applyIndustryPreset(ind) {
      state.industry = ind;
      if (ind === 'pharmacy' || ind === 'retail') { state.cfg.expiry = true; state.cfg.autoDimSym = false; }
      else if (ind === 'electronics' || ind === 'parts') { state.cfg.serial = true; state.cfg.expiry = false; }
      else if (ind === 'apparel') { state.cfg.variant = true; state.cfg.expiry = false; }
      else if (ind === 'hardware' || ind === 'wholesale') { state.cfg.counter = true; state.cfg.autoDimSym = true; }
      saveState(); renderAll(); showToast(t('savedOk'));
    }

    function switchActiveUser(uid) {
      state.activeUserId = uid;
      const u = curUser();
      state.branchScope = u.branch && u.branch !== 'all' ? u.branch : 'all';
      saveState(); renderAll(); showToast(u.name);
    }

    function toggleUserPerm(uid, key) {
      const u = state.users.find((x) => x.id === uid);
      if (!u || u.roleKey === 'owner') return;
      u.perms[key] = !u.perms[key];
      saveState(); renderAll();
    }

    function updateChannelField(cid, key, val) {
      const c = state.channels.find((x) => x.id === cid);
      if (!c) return;
      c[key] = val;
      saveState(); renderSetupPage('channels');
    }

    function reviewPendingApproval(id, approve) {
      const idx = state.pendingApprovals.findIndex((x) => x.id === id);
      if (idx < 0) return;
      const a = state.pendingApprovals[idx];
      if (approve) {
        const it = state.inventory.find((x) => x.id === a.itemId);
        if (it) {
          it.branchStock[a.branch] = a.counted;
          state.warehouseLedger.push({
            id: Date.now(), docNo: 'ADJ-' + Math.floor(100 + Math.random() * 900), type: 'ADJ', status: 'valid',
            branch: a.branch, itemId: it.id, itemName: it.name, unit: getUnitLabel(it), loc: it.zoneCode || 'A-01',
            openBal: a.sysBal, inQty: a.diff > 0 ? a.diff : 0, outQty: a.diff < 0 ? Math.abs(a.diff) : 0, endBal: a.counted,
            party: a.requestedBy, ref: t('sAudit'), date: new Date().toISOString().slice(0, 10)
          });
        }
      }
      state.pendingApprovals.splice(idx, 1);
      saveState(); renderAll(); showToast(t('savedOk'));
    }

    function clearOperationalData() {
      verifyPin(true, () => {
        state.warehouseLedger = []; state.salesLedger = []; state.purchasesLedger = [];
        state.creditLedger = []; state.expensesLedger = []; state.pendingApprovals = [];
        state.tally.tickets = []; state.inventory.forEach((i) => { i.branchStock = {}; });
        saveState(); renderAll(); showToast(t('savedOk'));
      });
    }

    function resetAllDefaults() {
      localStorage.removeItem(STORE_KEY);
      state = loadState();
      renderAll();
      showToast(t('savedOk'));
    }

    // -------------------------------------------------------------------------
    // 11. ቋሚ መረጃ መመዝገቢያ ሞዳሎች እና በጅምላ ማስገቢያ
    // -------------------------------------------------------------------------
    function openItemModal(editId = null) {
      const it = editId ? state.inventory.find((x) => x.id === editId) : null;
      const units = t('units');
      const styles = t('styles');
      openModal(it ? t('edit') : t('newItem'), `
        <div><label class="lbl">${esc(t('item'))}</label><input id="imName" class="inp" value="${esc(it?.name || '')}" oninput="onSmartInput(this)"></div>
        <div class="grid-2">
          <div><label class="lbl">${esc(t('category'))}</label><input id="imCat" class="inp" value="${esc(it?.category || '')}"></div>
          <div><label class="lbl">${esc(t('unit'))}</label><select id="imUnit" class="sel">${units.map((u, idx) => `<option value="${idx}" ${(it?.unitIdx ?? 0) === idx ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
        </div>
        <div class="grid-2">
          <div><label class="lbl">${esc(t('packSize'))}</label><input id="imPack" type="number" min="1" class="inp mono" value="${it?.packSize || 1}"></div>
          <div><label class="lbl">${esc(t('subUnit'))}</label><select id="imSubU" class="sel">${units.map((u, idx) => `<option value="${idx}" ${(it?.subUnitIdx ?? 0) === idx ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
        </div>
        <div class="grid-2">
          <div><label class="lbl">${esc(t('storageStyle'))}</label><select id="imStyle" class="sel">${styles.map((s, idx) => `<option value="${idx}" ${(it?.styleIdx ?? 1) === idx ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
          <div><label class="lbl">${esc(t('zoneCode'))}</label><input id="imZone" class="inp mono" value="${esc(it?.zoneCode || 'A-01')}" style="text-transform:uppercase;"></div>
        </div>
        ${hasPerm('sellPrice') ? `
          <div class="grid-3">
            ${hasPerm('costPrice') ? `<div><label class="lbl">${esc(t('costPrice'))}</label><input id="imCost" type="number" step="0.01" class="inp mono" value="${it?.landedCost || 0}"></div>` : `<input id="imCost" type="hidden" value="${it?.landedCost || 0}">`}
            <div><label class="lbl">${esc(t('floorPrice'))}</label><input id="imFloor" type="number" step="0.01" class="inp mono" value="${it?.floorPrice || 0}"></div>
            <div><label class="lbl">${esc(t('unitPrice'))}</label><input id="imSell" type="number" step="0.01" class="inp mono" value="${it?.sellPrice || 0}"></div>
          </div>` : ''}
        ${state.cfg.expiry ? `<div><label class="lbl">${esc(t('expiryDate'))}</label><input id="imExp" type="date" class="inp" value="${esc(it?.expiry || '')}"></div>` : ''}
        ${state.cfg.serial ? `<div><label class="lbl">${esc(t('serialNo'))}</label><input id="imSer" class="inp mono" value="${esc(it?.serial || '')}"></div>` : ''}
        ${state.cfg.variant ? `<div><label class="lbl">${esc(t('variant'))}</label><input id="imVar" class="inp" value="${esc(it?.variant || '')}"></div>` : ''}
        ${!it ? `
          <div class="grid-2">
            <div><label class="lbl">${esc(t('mBranches'))}</label><select id="imBr" class="sel">${state.branches.map((b) => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('')}</select></div>
            <div><label class="lbl">${esc(t('openingBal'))}</label><input id="imOpen" type="number" min="0" class="inp mono" value="0"></div>
          </div>` : ''}`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn teal" onclick="saveItemModal(${editId || 'null'})">${esc(t('save'))}</button>`);
    }

    function saveItemModal(editId) {
      const name = formatSmartDim(document.getElementById('imName').value.trim());
      if (!name) return;
      const payload = {
        name,
        category: document.getElementById('imCat').value.trim() || t('allCategories'),
        unitIdx: Number(document.getElementById('imUnit').value || 0),
        subUnitIdx: Number(document.getElementById('imSubU').value || 0),
        packSize: Math.max(1, Number(document.getElementById('imPack').value || 1)),
        styleIdx: Number(document.getElementById('imStyle').value || 1),
        zoneCode: document.getElementById('imZone').value.trim().toUpperCase() || 'A-01',
        expiry: document.getElementById('imExp')?.value || '',
        serial: document.getElementById('imSer')?.value.trim() || '',
        variant: document.getElementById('imVar')?.value.trim() || ''
      };
      if (hasPerm('sellPrice')) {
        payload.landedCost = Number(document.getElementById('imCost')?.value || 0);
        payload.floorPrice = Number(document.getElementById('imFloor')?.value || 0);
        payload.sellPrice = Number(document.getElementById('imSell')?.value || 0);
      }
      if (editId) {
        const it = state.inventory.find((x) => x.id === editId);
        if (it) Object.assign(it, payload);
      } else {
        const br = document.getElementById('imBr')?.value;
        const op = Math.max(0, Number(document.getElementById('imOpen')?.value || 0));
        const stock = {};
        if (br && op > 0) stock[br] = op;
        state.inventory.push({
          id: Date.now(), sku: 'KS-' + Math.floor(100 + Math.random() * 900),
          landedCost: 0, floorPrice: 0, sellPrice: 0, ...payload, branchStock: stock
        });
      }
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function openBulkImportModal() {
      const brOpts = state.branches.map((b) => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');
      openModal(t('bulkImport'), `
        <div><label class="lbl">${esc(t('mBranches'))}</label><select id="biBr" class="sel">${brOpts}</select></div>
        <textarea id="biTxt" class="txtarea" placeholder="${esc(L('ምድብ\nዕቃ 1\t50\nዕቃ 2\t120', 'Category\nItem 1\t50\nItem 2\t120'))}"></textarea>`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn primary" onclick="runBulkImport()">${esc(t('bulkImport'))}</button>`);
    }

    function runBulkImport() {
      const raw = document.getElementById('biTxt').value.trim();
      const br = document.getElementById('biBr').value;
      if (!raw) return;
      let curCat = t('allCategories'), added = 0;
      raw.split(/\r?\n/).forEach((line, idx) => {
        const parts = (line.includes('\t') ? line.split('\t') : line.split(',')).map((s) => s.trim());
        const c0 = parts[0] || '', c1 = parts[1] || '', c2 = parts[2] || '';
        if (!c0) return;
        let name = '', qty = 0;
        if (parts.length >= 3 && c2 !== '') { curCat = c0; name = formatSmartDim(c1); qty = Math.max(0, parseInt(c2.replace(/[^\d]/g, ''), 10) || 0); }
        else if (parts.length >= 2 && /^-?\d[\d,]*$/.test(c1)) { name = formatSmartDim(c0); qty = Math.max(0, parseInt(c1.replace(/[^\d]/g, ''), 10) || 0); }
        else if (parts.length >= 2 && c1 !== '') { curCat = c0; name = formatSmartDim(c1); }
        else { curCat = c0; return; }
        if (!name) return;
        const ex = state.inventory.find((i) => i.name.toLowerCase() === name.toLowerCase());
        if (!ex) {
          const bs = {}; if (qty > 0) bs[br] = qty;
          state.inventory.push({
            id: Date.now() + idx, sku: 'KS-' + Math.floor(100 + Math.random() * 900), name, category: curCat,
            unitIdx: 0, subUnitIdx: 0, packSize: 1, styleIdx: 1, zoneCode: 'A-01',
            landedCost: 0, floorPrice: 0, sellPrice: 0, expiry: '', serial: '', variant: '', branchStock: bs
          });
          added++;
        } else if (qty > 0) {
          ex.branchStock[br] = Number(ex.branchStock[br] || 0) + qty;
        }
      });
      saveState(); closeModal(); renderAll(); showToast(`${t('savedOk')} (${added})`);
    }

    function openBranchModal(editId = null) {
      const b = editId ? state.branches.find((x) => x.id === editId) : null;
      openModal(t('mBranches'), `
        <input id="brN" class="inp" value="${esc(b?.name || '')}" placeholder="${esc(t('mBranches'))}">
        <input id="brC" class="inp mono" value="${esc(b?.code || '')}" placeholder="${esc(t('zoneCode'))}" style="text-transform:uppercase;">
        <div class="grid-2">
          <div><label class="lbl">${esc(t('outOfStock'))}</label><input id="brCrit" type="number" class="inp mono" value="${b?.criticalLimit ?? 5}"></div>
          <div><label class="lbl">${esc(t('lowStock'))}</label><input id="brLow" type="number" class="inp mono" value="${b?.lowLimit ?? 20}"></div>
        </div>`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn amber" onclick="saveBranchModal(${editId || 'null'})">${esc(t('save'))}</button>`);
    }

    function saveBranchModal(editId) {
      const name = document.getElementById('brN').value.trim();
      const code = document.getElementById('brC').value.trim().toUpperCase() || 'BR';
      const criticalLimit = Math.max(0, Number(document.getElementById('brCrit').value || 5));
      const lowLimit = Math.max(criticalLimit, Number(document.getElementById('brLow').value || 20));
      if (!name) return;
      if (editId) {
        const b = state.branches.find((x) => x.id === editId);
        if (b) Object.assign(b, { name, code, criticalLimit, lowLimit });
      } else {
        state.branches.push({ id: Date.now(), name, code, seq: 1, criticalLimit, lowLimit, mapX: 50, mapY: 50 });
      }
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function openBankModal() {
      openModal(t('mBanks'), `
        <input id="bkN" class="inp" placeholder="${esc(t('bankCol'))}">
        <input id="bkA" class="inp mono" placeholder="${esc(t('accountCol'))}">
        <input id="bkO" type="number" class="inp mono" value="0" placeholder="${esc(t('openingBal'))}">`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn emerald" onclick="saveBankModal()">${esc(t('save'))}</button>`);
    }

    function saveBankModal() {
      const name = document.getElementById('bkN').value.trim();
      if (!name) return;
      state.banks.push({ id: Date.now(), name, acc: document.getElementById('bkA').value.trim() || '-', opening: Number(document.getElementById('bkO').value || 0) });
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function openSupplierModal() {
      openModal(t('mSuppliers'), `
        <input id="spN" class="inp" placeholder="${esc(t('supplier'))}">
        <input id="spP" class="inp mono" placeholder="09...">
        <input id="spC" class="inp" placeholder="${esc(t('category'))}">`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn primary" onclick="saveSupplierModal()">${esc(t('save'))}</button>`);
    }

    function saveSupplierModal() {
      const name = document.getElementById('spN').value.trim();
      if (!name) return;
      state.suppliers.push({ id: Date.now(), name, phone: document.getElementById('spP').value.trim(), category: document.getElementById('spC').value.trim() || '-' });
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function openExpenseModal() {
      const bOpts = state.banks.map((b) => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');
      openModal(t('mExpenses'), `
        <input id="exT" class="inp" placeholder="${esc(t('mExpenses'))}">
        <input id="exA" type="number" class="inp mono" placeholder="${esc(t('total'))}">
        <select id="exB" class="sel">${bOpts}</select>`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn amber" onclick="saveExpenseModal()">${esc(t('save'))}</button>`);
    }

    function saveExpenseModal() {
      const title = document.getElementById('exT').value.trim();
      const amount = Number(document.getElementById('exA').value || 0);
      if (!title || amount <= 0) return;
      state.expensesLedger.push({ id: Date.now(), title, amount, bank: document.getElementById('exB').value, date: new Date().toISOString().slice(0, 10) });
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function openUserModal() {
      const roles = t('roles');
      const brOpts = `<option value="all">${esc(t('allBranches'))}</option>` + state.branches.map((b) => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');
      openModal(t('mUsers'), `
        <div class="grid-2">
          <input id="uName" class="inp" placeholder="${esc(t('mUsers'))}">
          <input id="uPin" class="inp mono" maxlength="6" inputmode="numeric" value="1111" placeholder="${esc(t('gatePin'))}">
        </div>
        <div class="grid-2">
          <select id="uRole" class="sel">${Object.entries(roles).map(([k, v]) => `<option value="${k}">${esc(v)}</option>`).join('')}</select>
          <select id="uBr" class="sel">${brOpts}</select>
        </div>`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn teal" onclick="saveUserModal()">${esc(t('save'))}</button>`);
    }

    function saveUserModal() {
      const name = document.getElementById('uName').value.trim();
      const pin = document.getElementById('uPin').value.trim() || '1111';
      const roleKey = document.getElementById('uRole').value;
      if (!name) return;
      const presets = {
        owner: { sellPrice: true, floorPrice: true, costPrice: true, profit: true, banks: true, approve: true, pay: true, editVoid: true },
        finance: { sellPrice: true, floorPrice: true, costPrice: true, profit: false, banks: true, approve: false, pay: true, editVoid: false },
        sales: { sellPrice: true, floorPrice: true, costPrice: false, profit: false, banks: false, approve: false, pay: false, editVoid: false },
        warehouse: { sellPrice: false, floorPrice: false, costPrice: false, profit: false, banks: false, approve: false, pay: false, editVoid: false },
        driver: { sellPrice: false, floorPrice: false, costPrice: false, profit: false, banks: false, approve: false, pay: false, editVoid: false }
      };
      state.users.push({ id: Date.now(), name, pin, roleKey, branch: document.getElementById('uBr').value, perms: presets[roleKey] || presets.warehouse });
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    function openChannelModal() {
      const plats = t('platforms');
      openModal(t('mChannels'), `
        <input id="chLbl" class="inp" placeholder="${esc(t('mChannels'))}">
        <select id="chPlt" class="sel">${plats.map((p, i) => `<option value="${i}">${esc(p)}</option>`).join('')}</select>
        <div class="grid-3">
          <select id="chTier" class="sel">
            <option value="qty">${esc(t('tierQtyOnly'))}</option>
            <option value="full">${esc(t('tierFullFin'))}</option>
          </select>
          <select id="chFmt" class="sel">
            <option value="image">${esc(t('image'))}</option>
            <option value="text">${esc(t('text'))}</option>
            <option value="pdf">${esc(t('pdf'))}</option>
            <option value="excel">${esc(t('excel'))}</option>
          </select>
          <select id="chTrig" class="sel">
            <option value="instant">${esc(t('trigInstant'))}</option>
            <option value="daily">${esc(t('trigDaily'))}</option>
            <option value="weekly">${esc(t('trigWeekly'))}</option>
            <option value="monthly">${esc(t('trigMonthly'))}</option>
            <option value="both">${esc(t('trigBoth'))}</option>
          </select>
        </div>
        <input id="chAddr" class="inp mono" placeholder="${esc(t('refNo'))}">`, `
        <button type="button" class="btn muted" onclick="closeModal()">${esc(t('cancel'))}</button>
        <button type="button" class="btn primary" onclick="saveChannelModal()">${esc(t('save'))}</button>`);
    }

    function saveChannelModal() {
      const label = document.getElementById('chLbl').value.trim();
      if (!label) return;
      state.channels.push({
        id: Date.now(), label, platformIdx: Number(document.getElementById('chPlt').value || 0),
        tier: document.getElementById('chTier').value, format: document.getElementById('chFmt').value,
        trigger: document.getElementById('chTrig').value, target: document.getElementById('chAddr').value.trim(), active: true
      });
      saveState(); closeModal(); renderAll(); showToast(t('savedOk'));
    }

    // -------------------------------------------------------------------------
    // 12. ማስጀመሪያ (BOOT)
    // -------------------------------------------------------------------------
    window.addEventListener('online', syncOfflineQueue);

    (function boot() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).catch(() => {});
      }
      if (state.loggedIn) enterApp();
      else {
        document.getElementById('loginGate').style.display = 'flex';
        document.getElementById('appShell').style.display = 'none';
        renderGate();
      }
    })();
  </script>
